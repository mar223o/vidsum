<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vidsumly</title>
<meta name="application-name" content="Vidsumly"><!-- nazwa techniczna: VidSum -->
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
/* Vidsumly 0.10.x (dawniej VidSum) — grafitowy granat i jeden akcent (lazur); wcześniej: kolory marki z ikony,
   jedna rzecz zapada w pamięć: poświata z samego filmu za odtwarzaczem i nagłówkiem wyniku. Reszta cicha. */
:root{
  /* 0.10.0 — jeden akcent: lazur (niebieski → błękit tylko w obrębie tej samej barwy). Tło: grafitowy granat. */
  --bg:#090c12; --bg2:#0d111a; --panel:#121722; --card:#171d2a; --raised:#1e2535;
  --ink:#e9edf5; --ink2:#c3cad8; --muted:#8b94a9; --faint:#5c6479;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12); --hl:rgba(255,255,255,.045);
  --accent:#5b9bff; --accent-2:#38c4ff; --accent-ink:#fff; --accent-soft:rgba(91,155,255,.14); --glow:rgba(61,123,255,.55);
  --ok:#3dd9a0; --bad:#ff7a85; --warn:#f2b84b;
  --speech:#7fb0ff; --vision:#9fd8ff; --est:#f2b84b; --none:#7c8196;
  --grad:linear-gradient(120deg,#3d7bff 0%,#38c4ff 100%);
  --grad-soft:linear-gradient(120deg,rgba(61,123,255,.18),rgba(56,196,255,.10));
  --shadow:0 1px 0 var(--hl) inset,0 1px 2px rgba(0,0,0,.4),0 12px 32px -12px rgba(0,0,0,.6);
  --shadow-lg:0 1px 0 var(--hl) inset,0 2px 6px rgba(0,0,0,.35),0 30px 80px -24px rgba(0,0,0,.75);
  --display:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Mono",ui-monospace,Consolas,monospace;
  --serif:var(--display);
  --r-lg:22px; --r:16px; --r-sm:12px; color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f5f9; --bg2:#edf0f6; --panel:#ffffff; --card:#f6f8fc; --raised:#ffffff;
  --ink:#121826; --ink2:#2c3446; --muted:#5f6880; --faint:#98a0b4;
  --line:rgba(18,24,38,.08); --line2:rgba(18,24,38,.14); --hl:rgba(255,255,255,.9);
  --accent:#2f6bff; --accent-2:#0ea5e9; --accent-soft:rgba(47,107,255,.09); --glow:rgba(47,107,255,.35);
  --ok:#0f9f6e; --bad:#e0314f; --warn:#b7791f;
  --speech:#2f5fd0; --vision:#0b7ec2; --est:#b7791f; --none:#6b7186;
  --shadow:0 1px 2px rgba(18,24,38,.06),0 10px 30px -14px rgba(18,24,38,.18);
  --shadow-lg:0 2px 6px rgba(18,24,38,.06),0 30px 70px -28px rgba(18,24,38,.28); color-scheme:light;
}
@media (prefers-color-scheme: light){
  :root[data-theme="system"]{
    --bg:#f3f5f9; --bg2:#edf0f6; --panel:#ffffff; --card:#f6f8fc; --raised:#ffffff;
    --ink:#121826; --ink2:#2c3446; --muted:#5f6880; --faint:#98a0b4;
    --line:rgba(18,24,38,.08); --line2:rgba(18,24,38,.14); --hl:rgba(255,255,255,.9);
    --accent:#2f6bff; --accent-2:#0ea5e9; --accent-soft:rgba(47,107,255,.09); --glow:rgba(47,107,255,.35);
    --ok:#0f9f6e; --bad:#e0314f; --warn:#b7791f;
    --speech:#2f5fd0; --vision:#0b7ec2; --est:#b7791f; --none:#6b7186;
    --shadow:0 1px 2px rgba(18,24,38,.06),0 10px 30px -14px rgba(18,24,38,.18);
    --shadow-lg:0 2px 6px rgba(18,24,38,.06),0 30px 70px -28px rgba(18,24,38,.28); color-scheme:light; }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:15px/1.6 var(--sans);font-feature-settings:"ss01";-webkit-font-smoothing:antialiased;
  background:var(--bg);
  background-image:radial-gradient(1200px 520px at 50% -180px,rgba(61,123,255,.16),transparent 70%),
                   radial-gradient(700px 400px at 100% 0,rgba(61,107,255,.08),transparent 70%);
  background-attachment:fixed;min-height:100vh}
:root[data-theme="light"] body{background-image:radial-gradient(1200px 520px at 50% -200px,rgba(61,123,255,.10),transparent 70%)}
button{font:inherit;color:inherit}
a{color:var(--accent)}
::selection{background:rgba(61,123,255,.35)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num,.timer,.tsb,.tval,.dur,.tr-line code{font-variant-numeric:tabular-nums}

/* ---------- nagłówek: szkło ---------- */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 24px;
  background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(18px) saturate(1.4);
  border-bottom:1px solid var(--line)}
.logo{display:inline-flex;align-items:center;gap:10px;font:700 19px var(--display);letter-spacing:-.02em;text-decoration:none;color:var(--ink)}
.logo img{border-radius:9px;display:block;box-shadow:0 4px 18px -4px var(--glow)}
.logo i{font-style:normal;color:inherit}
nav{display:flex;gap:2px;background:var(--hl);border:1px solid var(--line);border-radius:99px;padding:3px}
nav a{padding:5px 14px;border-radius:99px;text-decoration:none;color:var(--muted);font-size:13.5px;font-weight:500;transition:color .15s,background .15s}
nav a:hover{color:var(--ink)}
nav a.on{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;justify-content:flex-end}
.chip{font-size:11.5px;padding:3px 10px 3px 8px;border-radius:99px;background:var(--hl);border:1px solid var(--line);color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--faint)}
.chip.ok::before{background:var(--ok);box-shadow:0 0 8px var(--ok)}.chip.bad{color:var(--bad)}.chip.bad::before{background:var(--bad)}
.seg{display:inline-flex;background:var(--hl);border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px}
.seg button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:5px 13px;border-radius:99px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap;transition:.15s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}
main{max-width:1320px;margin:0 auto;padding:36px 24px 100px}
.eyebrow{font:500 13px var(--sans);color:var(--muted);letter-spacing:0}
.hand{display:none}
.label{font:600 13px var(--sans);color:var(--ink2);letter-spacing:0}
.label::first-letter{text-transform:uppercase}
.col-break>.label,.col-break>.rule,.chatbox>.rule{display:none}
.section-h a{color:var(--muted);text-decoration:none;font-size:14px}.section-h a:hover{color:var(--ink)}
.rule{border:0;border-top:1px solid var(--line);margin:8px 0 16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:1px solid var(--line2);background:var(--hl);border-radius:99px;padding:7px 15px;font-size:13px;font-weight:500;cursor:pointer;
  transition:border-color .15s,background .15s,color .15s,transform .1s;color:var(--ink2)}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 60%,transparent);color:var(--ink);background:var(--accent-soft)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;font-weight:600;
  box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 8px 24px -8px var(--glow)}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn.ico{padding:6px 11px}
.btn.sm{padding:4px 10px;font-size:12.5px;min-width:30px}

/* ---------- strona główna ---------- */
.hero{padding:26px 0 8px;max-width:820px}
.hero .eyebrow{display:none}
.hero h1{font:700 clamp(34px,5.2vw,60px)/1.02 var(--display);margin:0 0 14px;letter-spacing:-.035em;
  background:linear-gradient(180deg,var(--ink) 30%,color-mix(in srgb,var(--ink) 55%,transparent));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1 i{font-style:normal}
.hero p{color:var(--muted);margin:0 0 28px;font-size:17px;max-width:62ch}
.panel{background:color-mix(in srgb,var(--panel) 86%,transparent);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow-lg);backdrop-filter:blur(10px)}
#drop{position:relative;border-radius:var(--r);padding:44px 18px;text-align:center;cursor:pointer;transition:.2s;
  background:linear-gradient(var(--bg2),var(--bg2)) padding-box,var(--grad) border-box;border:1px solid transparent;overflow:hidden}
#drop::after{content:"";position:absolute;inset:0;background:var(--grad-soft);opacity:0;transition:opacity .25s;pointer-events:none}
#drop:hover::after,#drop.over::after{opacity:1}
#drop.over{transform:scale(1.005)}
#drop b{font:650 22px var(--display);letter-spacing:-.02em;display:block;margin-bottom:4px;position:relative;z-index:1}
#drop small{position:relative;z-index:1}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
textarea,input,select{font:inherit;color:inherit;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:9px 12px;transition:border-color .15s,box-shadow .15s}
textarea:focus,input:focus,select:focus{outline:none;border-color:color-mix(in srgb,var(--accent) 70%,transparent);box-shadow:0 0 0 4px var(--accent-soft)}
textarea{flex:1;min-width:220px;min-height:46px;resize:vertical}
.pvsw{display:inline-flex;align-items:center;gap:9px;font-size:13.5px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.pvsw input{position:absolute;opacity:0;width:1px;height:1px}
.pvsw .knob{width:36px;height:21px;border-radius:21px;background:var(--line2);position:relative;transition:background .2s;flex:none}
.pvsw .knob::after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.pvsw input:checked+.knob{background:var(--grad);box-shadow:0 0 14px -2px var(--glow)}
.pvsw input:checked+.knob::after{transform:translateX(15px)}
.pvsw input:focus-visible+.knob{outline:2px solid var(--accent);outline-offset:2px}
.pvsw:has(input:checked){color:var(--ink)}
details>summary{cursor:pointer;color:var(--muted);font-size:14px;padding:4px 0}
details>summary:hover{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
label.f{display:grid;gap:5px;font-size:12.5px;color:var(--muted)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:44px 0 14px}
.section-h h2{font:650 22px var(--display);letter-spacing:-.02em;margin:0}
.job{display:grid;gap:8px;padding:14px 0}
.job+.job{border-top:1px solid var(--line)}
.job-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.job-top .name{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font-size:11.5px;font-weight:500;padding:2px 9px;border-radius:99px;background:var(--hl);border:1px solid var(--line)}
.st.trwa{color:var(--accent)}.st.gotowe{color:var(--ok)}.st.blad{color:var(--bad)}.st.w_kolejce{color:var(--muted)}
.timer{font:600 12px var(--mono);color:var(--muted);white-space:nowrap}.stage{font-size:12px;color:var(--accent)}
.parts{display:flex;gap:6px;flex-wrap:wrap}.parts button{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer}
.parts button.on{background:var(--raised);color:var(--ink);border-color:var(--line2)}
.part{max-height:260px;overflow:auto;font-size:13.5px;line-height:1.5;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.part div{display:flex;gap:10px}.part code{color:var(--muted);flex:none}
pre.log{margin:0;font:12px/1.5 var(--mono);color:var(--muted);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 11px;max-height:130px;overflow:auto;white-space:pre-wrap}
pre.log.full{max-height:340px}

/* ---------- biblioteka ---------- */
.lib-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.lib-tools input{flex:1;min-width:200px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;
  box-shadow:var(--shadow);transition:transform .2s,border-color .2s,box-shadow .2s}
.vcard:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:var(--shadow-lg)}
.vcard .th{aspect-ratio:16/10;background:var(--card) center/cover no-repeat;position:relative}
.vcard .th::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(7,8,12,.55))}
.vcard .th .dur{position:absolute;right:9px;bottom:9px;z-index:1;background:rgba(7,8,12,.7);backdrop-filter:blur(6px);color:#fff;font:600 11px var(--mono);padding:2px 7px;border-radius:7px}
.vcard .bd{padding:13px 15px 15px;display:grid;gap:6px}
.vcard h3{font:650 17px/1.25 var(--display);letter-spacing:-.015em;margin:0}.vcard h3 i{font-style:normal;color:inherit}
.vcard p{margin:0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{display:inline-block;font:600 11px var(--sans);padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);width:max-content}
.empty{color:var(--muted);font-size:14px;padding:18px 0}

/* ---------- wynik ---------- */
#res{position:relative;overflow-anchor:auto}
main{overflow-x:clip}
/* poświata z filmu (jak tryb kinowy): rozmyty, nasycony kadr za nagłówkiem i odtwarzaczem */
.ambient{position:absolute;left:50%;top:-120px;width:min(1400px,120vw);height:720px;transform:translateX(-50%);z-index:-1;pointer-events:none;
  background:center/cover no-repeat;filter:blur(90px) saturate(1.8);opacity:.38;
  mask-image:radial-gradient(closest-side,#000 35%,transparent);-webkit-mask-image:radial-gradient(closest-side,#000 35%,transparent)}
:root[data-theme="light"] .ambient{opacity:.22}
.modebar{display:flex;justify-content:center;margin:-10px 0 22px}
.r-head{max-width:900px;margin:0 auto 30px}
.r-head .eyebrow{font-size:13.5px;color:var(--ink2)}
.r-head h1{font:700 clamp(34px,5.4vw,62px)/1.02 var(--display);margin:8px 0 12px;letter-spacing:-.04em}
.r-head h1 i{display:block;font-style:normal;color:var(--muted)}
.thesis{font:450 19px/1.5 var(--sans);color:var(--ink2);margin:10px 0 12px;max-width:62ch;padding:0}
.meta{font:500 12.5px var(--sans);color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap}
.meta span:empty{display:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.layout{display:grid;gap:28px;align-items:start}
.m-bal .layout{grid-template-columns:minmax(0,.95fr) minmax(0,1.35fr) minmax(0,1fr)}
.m-video .layout{grid-template-columns:minmax(0,.9fr) minmax(0,1.5fr)}
.m-video .col-sum{order:1}.m-video .col-mid{order:2}.m-video .col-break{grid-column:1/-1;order:3}
.m-read .layout{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.m-read .col-sum{order:1}.m-read .col-mid{order:2}.m-read .col-break{grid-column:1/-1;order:3}
.m-read .col-mid .chatbox{display:none}
.col-sum,.col-break{background:color-mix(in srgb,var(--panel) 82%,transparent);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 24px;box-shadow:var(--shadow)}
.summary{max-width:68ch;font-size:16px;line-height:1.7;color:var(--ink2)}
.summary p{margin:0 0 14px}
.summary p:first-child{color:var(--ink);font-size:17px}
blockquote.pull{margin:20px 0;padding:16px 18px 16px 20px;border-radius:var(--r);background:var(--grad-soft);border:1px solid var(--line);font:500 16px/1.55 var(--sans);position:relative;color:var(--ink)}
blockquote.pull::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--grad)}
.note{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 15px;margin:14px 0;font-size:14px;color:var(--ink2)}
.note h4{margin:0 0 6px;font:600 15px var(--display);color:var(--ink)}
.note ul{margin:4px 0;padding-left:18px}
/* odtwarzacz */
.player{border-radius:var(--r-lg);overflow:hidden;background:#000;position:relative;
  box-shadow:0 0 0 1px var(--line2),0 40px 100px -30px rgba(0,0,0,.85),0 0 120px -40px rgba(61,123,255,.4)}
.player video{display:block;width:100%;max-height:72vh;background:#000}
.player .nofilm{aspect-ratio:16/9;width:100%;max-height:72vh;display:grid;place-items:center;color:#ddd;background:#111 center/cover no-repeat;font-size:13px}
.m-read .player video{max-height:42vh}
.ph{background:rgba(7,8,12,.7);backdrop-filter:blur(8px);color:#fff;padding:7px 13px;border-radius:10px;font-size:13px;text-align:center;margin:12px}
.tsb{font:600 12px var(--mono);color:var(--ink);background:var(--hl);border:1px solid var(--line2);border-radius:99px;padding:1px 8px;cursor:pointer;white-space:nowrap;transition:.15s}
.tsb:hover{background:var(--grad);border-color:transparent;color:#fff}
/* czat */
.chatbox{margin-top:20px;background:color-mix(in srgb,var(--panel) 82%,transparent);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--shadow)}
.chatbox:empty{display:none}
.chatbox .hint{font:500 15px var(--sans);color:var(--ink2);margin:2px 0 12px}
.sugg{display:grid;gap:7px;margin-bottom:12px}
.sugg button{text-align:left;background:var(--hl);border:1px solid var(--line);border-radius:12px;padding:9px 13px;cursor:pointer;font-size:13.5px;color:var(--ink2);transition:.15s}
.sugg button:hover{border-color:var(--line2);color:var(--ink);background:var(--accent-soft)}
.msgs{display:grid;gap:10px;margin-bottom:12px}
.msg{padding:10px 14px;border-radius:14px;font-size:14px}
.msg.user{background:var(--grad);color:#fff;justify-self:end;max-width:85%;border-bottom-right-radius:5px}
.msg.bot{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.bot p{margin:0 0 6px}.msg.bot p:last-child{margin:0}
.ask{display:flex;gap:8px;background:var(--bg2);border:1px solid var(--line2);border-radius:99px;padding:5px 5px 5px 16px;transition:.15s}
.ask:focus-within{border-color:color-mix(in srgb,var(--accent) 70%,transparent);box-shadow:0 0 0 4px var(--accent-soft)}
.ask input{flex:1;border:0;background:none;padding:6px 0;outline:none;box-shadow:none}
.ask input:focus{box-shadow:none}
.ask button{border:0;background:var(--grad);color:#fff;border-radius:99px;width:36px;height:36px;cursor:pointer;font-size:16px}
/* rozbicie (prawa kolumna) */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 18px}
.tabs button{flex:0 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--hl);padding:6px 11px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap;border-radius:10px;transition:color .15s,background .15s,border-color .15s;min-width:0}
.tabs button svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.tabs button:hover{color:var(--ink)}
/* tryb kinowy */
.pbar{display:flex;justify-content:flex-end;gap:4px;flex-wrap:wrap;margin:8px 2px 0}
.pbar:empty{display:none}
.linkbtn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);font:500 13px var(--sans);cursor:pointer;padding:4px 6px;border-radius:8px}
.linkbtn:hover{color:var(--ink);background:var(--hl)}
.linkbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
#res.cinema .layout{grid-template-columns:minmax(0,1fr)!important}
#res.cinema .col-mid{grid-column:1/-1;order:-1}
#res.cinema .player video{max-height:84vh}
#res.cinema .player{box-shadow:0 0 0 1px var(--line2),0 60px 160px -40px rgba(0,0,0,.95),0 0 220px -30px rgba(61,123,255,.5)}
#res.cinema .r-head,#res.cinema .modebar,#res.cinema .col-sum,#res.cinema .col-break{opacity:.4;transition:opacity .3s}
#res.cinema .col-sum:hover,#res.cinema .col-break:hover,#res.cinema .r-head:hover,#res.cinema .modebar:hover{opacity:1}
#res.cinema .chatbox{max-width:900px}
/* rozdziały z paskami proporcji */
.chstrip{position:relative;height:10px;border-radius:99px;background:var(--hl);border:1px solid var(--line);margin:4px 0 14px;overflow:hidden}
.chstrip button{position:absolute;top:0;bottom:0;border:0;padding:0;cursor:pointer;background:var(--accent);opacity:.85;border-right:2px solid var(--panel)}
.chstrip button:nth-child(even){background:var(--accent-2)}
.chstrip button:hover{opacity:1;filter:brightness(1.15)}
.chstrip.au button{background:var(--ok)}.chstrip.au button:nth-child(even){background:color-mix(in srgb,var(--ok) 60%,var(--accent-2))}
.chbar{height:4px;border-radius:99px;background:var(--hl);margin-top:10px;overflow:hidden}
.chbar i{display:block;height:100%;border-radius:99px;background:var(--grad)}
.chbar.au i{background:var(--ok)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* najważniejsze: zwijane */
.kh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
details.it.kp{display:block;padding:0}
details.kp summary{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:12px 14px;cursor:pointer;list-style:none}
details.kp summary::-webkit-details-marker{display:none}
details.kp .kt{font:600 15px var(--display);color:var(--ink)}
details.kp summary::after{content:"";grid-column:3;display:none}
details.kp>p{margin:0;padding:0 14px 14px 48px;color:var(--ink2)}
details.kp[open] summary .kt{color:var(--ink)}
/* opis i komentarze */
.errtxt{color:var(--bad);font-size:13px}
.desc{white-space:pre-wrap;font-size:14px;line-height:1.65;color:var(--ink2);overflow-wrap:anywhere}
.coms{display:grid;gap:10px}
.com{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 14px}
.com.reply{margin-left:22px}
.com .ctop{display:flex;justify-content:space-between;gap:10px;font-size:13px;flex-wrap:wrap}
.com p{margin:6px 0 0;font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tabs button.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--ink)}
.tabs button.on svg{color:var(--accent);opacity:1}
.big{font:650 21px/1.2 var(--display);letter-spacing:-.02em;color:var(--ink);margin:0 0 14px}
.items{display:grid;gap:8px}
.it{display:grid;grid-template-columns:24px 1fr;gap:6px 10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;transition:border-color .2s,background .2s}
.it:hover{border-color:var(--line2)}
.it.now{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:var(--accent-soft);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 25%,transparent),0 10px 30px -14px var(--glow)}
.it .n{font:700 17px/1.3 var(--display);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.it h4{margin:2px 0 3px;font:600 15.5px/1.3 var(--display);letter-spacing:-.01em}
.it p{margin:0;font-size:13.5px;color:var(--muted)}
.it .top{display:flex;gap:8px;align-items:center;justify-content:space-between}
.it .tag{font:500 11px var(--sans);color:var(--muted);background:var(--hl);border:1px solid var(--line);padding:1px 8px;border-radius:99px}
.it.simple{grid-template-columns:62px 1fr;align-items:baseline}
.it.simple p{color:var(--ink);font:450 14.5px var(--sans)}
.it.simple.mom{grid-template-columns:136px 1fr;gap:14px;align-items:center;padding:8px;cursor:pointer}
.it.simple.mom:hover,.it.simple.mom.now{background:var(--raised)}
.mthumb{width:136px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#000;display:block;box-shadow:0 0 0 1px var(--line)}
.it.simple.mom p{margin:4px 0 0;font-size:14.5px}
.sub{margin:16px 0 8px;font:600 13px var(--sans);color:var(--ink2)}
.ingr{list-style:none;margin:0;padding:0;display:grid;gap:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.ingr li{display:flex;justify-content:space-between;gap:12px;padding:9px 14px;font-size:14px}
.ingr li+li{border-top:1px solid var(--line)}
.ingr li b{font-weight:550}
.ingr li span{color:var(--muted);text-align:right}
.chk{display:flex;gap:10px;align-items:flex-start}
.chk input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px}
.chk.done p{text-decoration:line-through;opacity:.55}
.tr-line{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.6}
.tr-line.ocr{color:var(--vision);font-size:13px}
.trtext{max-width:68ch}
.trbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12.5px;margin:-6px 0 12px}
.seg.small button{padding:3px 10px;font-size:12px}
.frame{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.frame img{width:100%;border-radius:10px;display:block;background:var(--card);cursor:pointer}
.src{font-size:10.5px;font-weight:500;padding:0 7px;border-radius:99px;background:color-mix(in srgb,currentColor 12%,transparent);margin-left:5px;white-space:nowrap;vertical-align:1px}
.src.mowa{color:var(--speech)}.src.obraz{color:var(--vision)}.src.szacunek{color:var(--est)}.src.brak_danych{color:var(--none)}
.timing{margin:12px 0 4px;font-size:13px}
.trow{display:grid;grid-template-columns:100px 1fr 58px;gap:10px;align-items:center;margin:4px 0;color:var(--muted)}
.tbar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}.tbar i{display:block;height:100%;background:var(--grad);border-radius:99px}
.tval{text-align:right;font-family:var(--mono);color:var(--ink)}
.md h2{font:650 18px var(--display);margin:18px 0 6px}.md h3{font:600 13px var(--sans);color:var(--ink2);margin:12px 0 4px}
.md ul,.md ol{margin:4px 0;padding-left:20px}.md li{margin:3px 0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--raised);color:var(--ink);border:1px solid var(--line2);
  padding:9px 18px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50;box-shadow:var(--shadow-lg)}
.toast.on{opacity:1;transform:translateX(-50%)}
.sumact{display:flex;gap:8px;margin:4px 0 16px;flex-wrap:wrap}
.res{font-size:13px;margin:8px 0}.res b{color:var(--ink)}
.rtime{font:500 12px var(--sans);color:var(--muted);margin-left:8px}
/* podgląd */
.pvtag{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:20px;font-size:11px;font-weight:600;
  color:var(--accent);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);vertical-align:1px}
.pvtag.done{background:var(--hl);border:1px solid var(--line);color:var(--muted);font-weight:500}
.summary.prelim{opacity:.85}
.pvnote{margin-top:6px}
/* mapa myśli */
.mapwrap{position:relative;border:1px solid var(--line);border-radius:var(--r);background:var(--bg2);overflow:hidden}
.mapwrap:fullscreen{border-radius:0;background:var(--bg)}
.mapwrap svg{display:block;width:100%;height:440px;cursor:grab;touch-action:none;user-select:none;font-family:var(--sans)}
.mapwrap svg.tall{touch-action:pan-y pinch-zoom}
.mapwrap:fullscreen svg{height:100vh!important}
.mapwrap svg.panning{cursor:grabbing}
.maptools{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:1}
.maptools .btn{background:color-mix(in srgb,var(--raised) 80%,transparent);backdrop-filter:blur(8px)}
.mnode{cursor:pointer}
.mnode:hover rect,.mnode:focus-visible rect{filter:brightness(1.15);stroke-width:2.4}
.mnode.on rect{stroke:var(--ink);stroke-width:2.4}
.mnode:focus{outline:none}
.mapinfo{margin:0 10px 10px}
.mapwrap:fullscreen .mapinfo{position:absolute;left:16px;bottom:16px;max-width:440px;margin:0;box-shadow:var(--shadow-lg)}
.mapinfo .top{margin:4px 0 6px}
/* język wyniku (tłumaczenie całości) */
.rlang{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.rlang .seg button.busy{color:var(--accent)}
.trnote{font-size:12.5px;color:var(--muted);margin:10px 0 0}
/* ---------- na żywo ---------- */
.livebar{margin-top:16px;display:grid;gap:9px}
.livebar.err{color:var(--bad);font-size:14px}
.lsteps{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px}
.lstep{color:var(--muted);padding:3px 11px;border-radius:99px;background:var(--hl);border:1px solid var(--line)}
.lstep.done{color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent);border-color:transparent}
.lstep.now{color:#fff;background:var(--grad);border-color:transparent;box-shadow:0 6px 20px -6px var(--glow);animation:pulse 1.8s ease-in-out infinite}
.lsep{width:12px;height:1px;background:var(--line2)}
.lnow{display:flex;gap:10px;align-items:baseline;font-size:12.5px;min-width:0}.lnow .muted{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes pulse{50%{box-shadow:0 6px 26px -4px var(--glow)}}
.skel{display:grid;gap:10px;margin:6px 0 14px}
.skel i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--line) 0%,var(--line2) 50%,var(--line) 100%);background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
/* jedyny „moment”: wynik zapala się jak ekran */
.appear{animation:fi .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes fi{from{opacity:0;filter:brightness(1.6) blur(2px)}to{opacity:1;filter:none}}
@media (prefers-reduced-motion:reduce){.appear,.skel i,.lstep.now{animation:none}*{transition:none!important;scroll-behavior:auto!important}}
@media (max-width:1100px){ .m-bal .layout{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)} .m-bal .col-sum{grid-column:1/-1;order:3} }
@media (max-width:760px){
  header{padding:10px 16px;gap:10px} main{padding:22px 16px 80px}
  .chips{display:none}
  .layout,.m-bal .layout,.m-video .layout,.m-read .layout{grid-template-columns:minmax(0,1fr)}
  .col-sum,.col-mid,.col-break{grid-column:auto!important;order:initial!important}
  .col-sum,.col-break,.chatbox{padding:16px;border-radius:var(--r)}
  .frame{grid-template-columns:90px 1fr}
  .it.simple.mom{grid-template-columns:100px 1fr}.mthumb{width:100px}
  #res.live .col-mid, #res.live .col-sum .skel{display:none}
}

/* ---------- 0.11.0: ikony, nawigacja, kolejka, ustawienia ---------- */
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.big{width:26px;height:26px;color:var(--accent)}
nav a{display:inline-flex;align-items:center;gap:7px}
nav a .ic{opacity:.8}
a.chip{text-decoration:none}a.chip:hover{color:var(--ink);border-color:var(--line2)}
.btn{display:inline-flex;align-items:center;gap:6px}
.btn.ico{padding:6px 9px}
.iconbtn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer}
.iconbtn:hover{background:var(--hl);border-color:var(--line);color:var(--ink)}
.iconbtn:focus-visible,.btn:focus-visible,nav a:focus-visible,.qtoggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel.start{display:grid;gap:12px}
#drop{display:grid;justify-items:center;gap:6px}
.startfoot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px}
.startfoot a{color:var(--muted);text-decoration:none}.startfoot a:hover{color:var(--ink)}
#queue{margin-top:22px}
.queue{padding:6px 8px}
.qhead{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:6px 6px}
.qtoggle{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--ink);font:inherit;cursor:pointer;padding:4px;border-radius:8px;min-width:0}
.qtoggle b{font:650 15px var(--display)}
.qtoggle .muted{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qtoggle .chev{transition:transform .2s;transform:rotate(-90deg)}
.queue.open .qtoggle .chev{transform:none}
.qnotice{margin:2px 6px 8px;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--ink2);font-size:13px}
.qlist{list-style:none;margin:0;padding:0 0 4px}
.qi{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 8px;border-top:1px solid var(--line)}
.qi.now{background:var(--accent-soft);border-radius:12px;border-top-color:transparent}
.qi.now+.qi{border-top-color:transparent}
.qth{width:52px;height:34px;border-radius:7px;background:var(--hl) center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.qmain{min-width:0;display:grid;gap:4px}
.qtop .name{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qmeta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.qacts{display:flex;gap:2px;align-items:center}
.qerr{font-size:12.5px;color:var(--bad);overflow-wrap:anywhere}
.qnote{font-size:12.5px;color:var(--muted)}
.qfoot{padding:8px 8px 6px;font-size:13px}.qfoot a{color:var(--muted);text-decoration:none}.qfoot a:hover{color:var(--ink)}
.qempty{margin:8px 4px}
.bar{height:4px;border-radius:99px;background:var(--hl);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.st.przerwane{color:var(--warn)}
.hero.slim{padding-bottom:0}.hero.slim h1{font-size:clamp(28px,4vw,40px)}.hero.slim p{margin-bottom:18px}
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px;align-items:start}
.sets h2{font:650 16px var(--display);margin:0 0 12px;letter-spacing:-.01em}
.sets .grid{margin-top:0}
.f span{display:block;margin-bottom:5px}
.f.wide{grid-column:1/-1}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}
.diag{display:grid;gap:8px}
.drow{display:grid;grid-template-columns:10px auto 1fr;gap:10px;align-items:baseline;font-size:13.5px}
.drow .muted{overflow-wrap:anywhere}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.sets.danger h2{color:var(--ink)}
@media (max-width:640px){ .setgrid{grid-template-columns:minmax(0,1fr)} .qi{grid-template-columns:40px minmax(0,1fr)} .qth{width:40px;height:28px} .qacts{grid-column:2} nav a span{display:none} }

/* ---------- 0.11.3: wynik „na jeden ekran” — strona się nie przewija, przewija się tylko kolumna ---------- */
.srclink{display:inline-flex;align-items:center;gap:6px;color:var(--accent);text-decoration:none;font-weight:550}
.srclink:hover{text-decoration:underline}
.col-sum,.col-break{container-type:inline-size}
@container (min-width:560px){
  .items{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ingr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .ingr li+li{border-top:0}.ingr li{border-bottom:1px solid var(--line)}
}
@container (min-width:900px){ .items{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (min-width:1000px) and (min-height:620px){
  body.resview main{max-width:none;height:calc(100vh - var(--hdr,60px));overflow:hidden;padding:14px 20px 16px}
  body.resview #res{height:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr);column-gap:16px}
  body.resview .modebar{grid-column:2;grid-row:1;margin:0;align-self:start}
  body.resview .r-head{grid-column:1;grid-row:1;max-width:none;margin:0 0 12px;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:18px;align-items:baseline}
  body.resview .r-head .eyebrow{grid-column:1/-1}
  body.resview .r-head h1{font-size:clamp(22px,2.2vw,30px);margin:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
  body.resview .r-head h1 i{display:inline;margin-left:10px}
  body.resview .thesis{font-size:14.5px;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:none}
  body.resview .r-head .meta,body.resview .r-head .actions{grid-column:1/-1;margin-top:6px}
  body.resview .r-head .actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  body.resview .r-head .btn{padding:5px 12px;font-size:12.5px}
  body.resview .layout{grid-column:1/-1;grid-row:2;min-height:0;height:100%;align-items:stretch;gap:16px}
  body.resview .layout>section{min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
  body.resview .col-sum,body.resview .col-break{padding:18px 20px}
  body.resview .col-mid{display:flex;flex-direction:column;gap:0}
  body.resview .player video,body.resview .player .nofilm{max-height:56vh}
  body.resview .chatbox{margin-top:12px}
  body.resview .m-video .layout{grid-template-columns:minmax(280px,1fr) minmax(0,1.3fr) minmax(320px,1.2fr)}
  body.resview .m-video .col-sum,body.resview .m-video .col-mid,body.resview .m-video .col-break{grid-column:auto;order:0}
  body.resview .m-bal .layout{grid-template-columns:minmax(0,1fr) minmax(0,.95fr) minmax(0,1.35fr)}
  body.resview .m-bal .col-sum{grid-column:auto;order:0}
  body.resview .m-read .layout{grid-template-columns:minmax(0,1.25fr) minmax(0,1.35fr) minmax(260px,.75fr)}
  body.resview .m-read .col-sum{order:1}body.resview .m-read .col-break{grid-column:auto;order:2}body.resview .m-read .col-mid{order:3}
  body.resview .m-read .player video,body.resview .m-read .player .nofilm{max-height:34vh}
  body.resview #res.cinema .layout{grid-template-columns:minmax(0,1fr)!important}
  body.resview #res.cinema .col-sum,body.resview #res.cinema .col-break{display:none}
  body.resview #res.cinema .player video{max-height:calc(100vh - var(--hdr,60px) - 170px)}
}

/* ---------- 0.11.3: Ustawienia — sekcje po lewej, treść po prawej ---------- */
.setwrap{display:grid;grid-template-columns:240px minmax(0,760px);gap:22px;align-items:start}
.setnav{display:grid;gap:3px;position:sticky;top:calc(var(--hdr,60px) + 16px)}
.setnav h1{font:700 26px var(--display);letter-spacing:-.02em;margin:4px 8px 14px}
.setnav button{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--muted);font:500 14px var(--sans);padding:9px 12px;border-radius:10px;cursor:pointer;text-align:left}
.setnav button:hover{background:var(--hl);color:var(--ink)}
.setnav button.on{background:var(--accent-soft);color:var(--ink)}
.setnav button.on .ic{color:var(--accent)}
.setnav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.setnav .autosave{margin:12px 12px 0}
.setmain .sets{padding:22px 24px}
.setmain .sets h2{font:650 19px var(--display);margin:0 0 16px}
.setmain .grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px 16px}
.f small.hint{display:block;margin-top:5px}
.savedok{border-color:var(--ok)!important;transition:border-color .2s}
details.adv{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
details.adv summary{cursor:pointer;color:var(--muted);font-size:13.5px}
@media (max-width:760px){ .setwrap{grid-template-columns:minmax(0,1fr)} .setnav{position:static;grid-template-columns:repeat(2,minmax(0,1fr))} .setnav h1,.setnav .autosave{grid-column:1/-1} }
</style>
</head>
<body>

let cinema = false;
try { cinema = localStorage.getItem("vs_cinema") === "1"; } catch {}
/* tryb kinowy: film na całą szerokość, reszta przygaszona; przełączanie bez przeładowania filmu */
function cinemaBtn(){
  const el = $("#pbar"); if (!el) return;
  const bars = cur && !cur.live && cur.r?.zrodlo?.obraz_bez_pasow;
  el.innerHTML = (bars ? `<button class="linkbtn" data-a="bars" aria-pressed="${!cur.fullFrame}" title="${esc(t("bars_hint"))}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 8h18M3 16h18"/></svg>${t(cur.fullFrame ? "bars_hide" : "bars_show")}</button>` : "") +
    (cur && !cur.live ? `<button class="linkbtn" data-a="cinema" aria-pressed="${cinema}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M7 10h10"/></svg>${t(cinema ? "cinema_off" : "cinema")}</button>` : "");
  $("#res")?.classList.toggle("cinema", cinema && !!cur && !cur.live);

function highlight(){

/* ---------- mapa myśli (0.8.2) ----------
   Środek: temat filmu. Gałęzie: rozdziały (liście: kroki z danego rozdziału albo momenty rozdziału) i „Najważniejsze”.
   Każdy węzeł ma czas — kliknięcie pokazuje opis i zdanie z transkrypcji z tej chwili oraz przewija film. */
const MAPC = ["#5b9bff","#38c4ff","#8b9dff","#45d0c0","#7fb3ff","#2fb8e8","#a8b8ff","#5fd4e8"];   // chłodne odcienie jednej palety
const clip = (x, n) => { x = String(x || "").trim(); return x.length > n ? x.slice(0, n - 1).trimEnd() + "…" : x; };
function mapData(d){
  const r = cur.r, kroki = (d.co_masz_zrobic?.kroki) || [], br = [];
  d.rozdzialy.forEach(ch => {
    let kids = kroki.filter(k => k.t >= ch.start && k.t < ch.end).map(k => ({label:k.tekst, t:k.t, info:k.tekst}));
    if (!kids.length) kids = (ch.momenty || []).map(m => ({label:m.tekst, t:m.t, info:m.tekst}));
    br.push({label:ch.tytul, t:ch.start, end:ch.end, info:ch.opis, kids:kids.slice(0, 6)});
  });
  if (d.najwazniejsze.length)
    br.push({label:t("map_key"), t:d.najwazniejsze[0].t, info:"", kids:d.najwazniejsze.slice(0, 6).map(x => ({label:x.tytul, t:x.t, info:x.opis}))});
  return {label:d.tytul || r.zrodlo.tytul || "Vidsumly", info:d.teza || "", t:0, kids:br};
}
function wrapTxt(x, n, max){            // podział etykiety na linie po ~n znaków (najwyżej max linii)
  const words = String(x || "").trim().split(/\s+/), out = [];
  let line = "";
  for (const w of words) {
    if (line && (line + " " + w).length > n) { out.push(line); line = w; } else line = line ? line + " " + w : w;
  }
  if (line) out.push(line);
  if (out.length > max) { out.length = max; out[max - 1] = clip(out[max - 1] + " …", n); }
  return out.length ? out : [""];
}
const CW = [8.4, 7.2, 6.9];             // szerokość znaku (px) na poziomach 0/1/2
function mapNode(n, lvl, c, maxw){
  const fs = lvl === 0 ? 14.5 : lvl === 1 ? 12.5 : 12, chars = Math.max(10, Math.floor((maxw - 24) / CW[lvl]));
  const lines = wrapTxt(n.label, chars, lvl === 2 ? 3 : 2);
  const w = Math.min(maxw, Math.max(...lines.map(l => l.length)) * CW[lvl] + 24), h = lines.length * (fs + 4) + (lvl === 0 ? 18 : 12);
  return {...n, lvl, c, lines, fs, w, h};
}
/* wąsko (kolumna obok filmu): drzewo z wcięciami — czytelne bez powiększania;
   szeroko (pełny ekran, tryb Czytaj): klasyczna mapa myśli, gałęzie po obu stronach środka */
function mapLayout(root, width){
  const nodes = [], edges = [], kids = root.kids;
  if (width < 700) {
    let y = 46;                            // miejsce na przyciski powiększania
    const r = mapNode(root, 0, "var(--accent)", width - 16); r.x = 8; r.y = y + r.h / 2; y += r.h + 12; nodes.push(r);
    kids.forEach((b, i) => {
      const c = MAPC[i % MAPC.length], bn = mapNode(b, 1, c, width - 40);
      bn.x = 30; bn.y = y + bn.h / 2; y += bn.h + 8; const bi = nodes.push(bn) - 1; edges.push([0, bi, c, "v"]);
      b.kids.forEach(l => { const ln = mapNode(l, 2, c, width - 68); ln.x = 56; ln.y = y + ln.h / 2; y += ln.h + 6;
        edges.push([bi, nodes.push(ln) - 1, c, "v"]); });
      y += 10;
    });
    return {nodes, edges, vb:[0, 0, width, Math.max(y, 120)]};
  }
  const r = mapNode(root, 0, "var(--accent)", 220); r.x = -r.w / 2; r.y = 0; nodes.push(r);
  const sides = [[], []]; kids.forEach((b, i) => sides[i < Math.ceil(kids.length / 2) ? 0 : 1].push([b, i]));
  let minY = -r.h / 2, maxY = r.h / 2;
  sides.forEach((side, si) => {
    const dir = si ? -1 : 1, blocks = side.map(([b, i]) => {
      const c = MAPC[i % MAPC.length], bn = mapNode(b, 1, c, 170), ls = b.kids.map(l => mapNode(l, 2, c, 240));
      const hh = Math.max(bn.h, ls.reduce((s, l) => s + l.h + 8, -8)); return {bn, ls, hh};
    });
    const total = blocks.reduce((s, x) => s + x.hh + 22, -22);
    let y = -total / 2;
    for (const {bn, ls, hh} of blocks) {
      bn.y = y + hh / 2; bn.x = dir > 0 ? r.w / 2 + 70 : -r.w / 2 - 70 - bn.w;
      const bi = nodes.push(bn) - 1; edges.push([0, bi, bn.c, "h"]);
      let ly = y + (hh - ls.reduce((s, l) => s + l.h + 8, -8)) / 2;
      for (const ln of ls) { ln.y = ly + ln.h / 2; ln.x = dir > 0 ? bn.x + bn.w + 50 : bn.x - 50 - ln.w; ly += ln.h + 8;
        edges.push([bi, nodes.push(ln) - 1, bn.c, "h"]); }
      y += hh + 22;
    }
    minY = Math.min(minY, -total / 2); maxY = Math.max(maxY, total / 2);
  });
  const xs = nodes.flatMap(n => [n.x, n.x + n.w]), x0 = Math.min(...xs) - 20, x1 = Math.max(...xs) + 20;
  return {nodes, edges, vb:[x0, minY - 20, x1 - x0, maxY - minY + 40]};
}
function mapSvg(d, width){
  const {nodes, edges, vb} = mapLayout(mapData(d), width);

  const path = ([a, b, c, k]) => { const A = nodes[a], B = nodes[b];
    if (k === "v") { const x = A.x + 12, top = A.y + A.h / 2; return `M${x},${top} V${B.y - 8} Q${x},${B.y} ${x + 8},${B.y} H${B.x}`; }
    const right = B.x > A.x, sx = right ? A.x + A.w : A.x, ex = right ? B.x : B.x + B.w, mx = (sx + ex) / 2;
    return `M${sx},${A.y} C${mx},${A.y} ${mx},${B.y} ${ex},${B.y}`; };
  const svgE = edges.map(e => `<path d="${path(e)}" stroke="${e[2]}" stroke-width="${nodes[e[0]].lvl ? 1.6 : 2.4}" fill="none" opacity=".8"/>`).join("");
  const svgN = nodes.map((n, i) => {
    const fill = n.lvl === 2 ? "var(--card)" : n.c, ink = n.lvl === 2 ? "var(--ink)" : "#fff";
    const ty = -((n.lines.length - 1) * (n.fs + 4)) / 2;
    return `<g class="mnode" data-i="${i}" tabindex="0" role="button" aria-label="${esc(n.label)}" transform="translate(${n.x},${n.y})">
      <rect x="0" y="${-n.h/2}" width="${n.w}" height="${n.h}" rx="${n.lvl === 2 ? 10 : Math.min(n.h / 2, 16)}" fill="${fill}" stroke="${n.c}" stroke-width="${n.lvl === 2 ? 1.4 : 0}"/>
      <text x="12" y="${ty}" dy=".35em" fill="${ink}" font-size="${n.fs}" font-weight="${n.lvl === 2 ? 450 : 600}">${n.lines.map((l, j) =>
        `<tspan x="12" dy="${j ? n.fs + 4 : 0}">${esc(l)}</tspan>`).join("")}</text></g>`; }).join("");
  return {inner:svgE + svgN, vb:vb.map(v => Math.round(v * 10) / 10)};
}
function mapHtml(d){
  const w = Math.round($("#tabc")?.clientWidth || 400), m = mapSvg(d, w);
  return `<h3 class="big">${t("t_map")}</h3>
    <div class="mapwrap" id="mapwrap"><div class="maptools"><button class="btn sm" data-z="1.25" aria-label="+">+</button><button class="btn sm" data-z="0.8" aria-label="−">−</button>
      <button class="btn sm" data-z="0">${t("map_reset")}</button><button class="btn sm" data-z="full">⤢ ${t("map_full")}</button></div>
      <svg id="mapsvg" viewBox="${m.vb.join(" ")}" data-vb="${m.vb.join(" ")}" class="${w < 700 ? "tall" : ""}" style="height:${w < 700 ? Math.max(m.vb[3] + 50, 240) : 460}px" preserveAspectRatio="xMidYMid meet">${m.inner}</svg><div id="mapinfo" class="note mapinfo" hidden></div></div>
    <p class="muted small">${t("map_hint")}</p>`;
}
function spokenAt(tt){                  // zdanie z transkrypcji (oryginał) w tej chwili filmu
  const segs = cur.r.transkrypcja?.segmenty || [];
  let best = null;
  for (const s of segs) { if (s.start <= tt + 0.5) best = s; else break; }
  return best ? best.text : "";
}
function initMap(){
  const svg = $("#mapsvg"); if (!svg) return;
  let vb = svg.dataset.vb.split(" ").map(Number), base = vb.slice();
  const set = () => svg.setAttribute("viewBox", vb.join(" "));
  const wrap = $("#mapwrap");
  wrap.addEventListener("fullscreenchange", () => {      // pełny ekran: szeroki układ; po wyjściu — z powrotem wąski
    const d = data(); if (!d) return;
    const full = document.fullscreenElement === wrap, m = mapSvg(d, full ? innerWidth : Math.round($("#tabc").clientWidth));
    svg.innerHTML = m.inner; vb = m.vb.slice(); base = vb.slice(); set();
    const tall = !full && m.vb[2] < 700;
    svg.classList.toggle("tall", tall);
    if (!full) svg.style.height = (tall ? Math.max(m.vb[3] + 50, 240) : 460) + "px";
  });
  const zoom = (f, cx, cy) => {               // f > 1 = przybliż; środek w punkcie (cx, cy) układu mapy
    if (cx == null) { cx = vb[0] + vb[2] / 2; cy = vb[1] + vb[3] / 2; }
    const w = Math.min(Math.max(vb[2] / f, base[2] / 6), base[2] * 2.5), k = w / vb[2];
    vb = [cx - (cx - vb[0]) * k, cy - (cy - vb[1]) * k, w, vb[3] * k]; set();
  };

    return [vb[0] + (e.clientX - r.left - (r.width - vb[2] / s) / 2) * s, vb[1] + (e.clientY - r.top - (r.height - vb[3] / s) / 2) * s, s]; };
  svg.addEventListener("wheel", e => {
    if (svg.classList.contains("tall") && !e.ctrlKey) return;    // wąska, wysoka mapa: kółko przewija stronę
    e.preventDefault(); const [x, y] = toMap(e); zoom(e.deltaY < 0 ? 1.15 : 1 / 1.15, x, y); }, {passive:false});
  let drag = null;
  svg.addEventListener("pointerdown", e => { drag = {x:e.clientX, y:e.clientY, vb:vb.slice(), moved:false, s:toMap(e)[2]}; svg.setPointerCapture(e.pointerId); });

    if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
    if (drag.moved) { vb = [drag.vb[0] - dx * drag.s, drag.vb[1] - dy * drag.s, vb[2], vb[3]]; set(); svg.classList.add("panning"); }
  });

    const was = drag; drag = null; svg.classList.remove("panning");
    if (was && !was.moved) { const g = document.elementFromPoint(e.clientX, e.clientY)?.closest(".mnode"); if (g) pickNode(Number(g.dataset.i)); }
  });
  svg.addEventListener("keydown", e => { const g = e.target.closest?.(".mnode"); if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); pickNode(Number(g.dataset.i)); } });
  $("#mapwrap .maptools").onclick = e => {
    const b = e.target.closest("[data-z]"); if (!b) return;
    if (b.dataset.z === "full") { const w = $("#mapwrap"); document.fullscreenElement ? document.exitFullscreen() : w.requestFullscreen?.().catch(()=>{}); return; }
    if (b.dataset.z === "0") { vb = base.slice(); set(); return; }
    zoom(Number(b.dataset.z));
  };
}
function pickNode(i){
  const n = cur.mapNodes?.[i], box = $("#mapinfo"); if (!n || !box) return;
  document.querySelectorAll(".mnode.on").forEach(g => g.classList.remove("on"));

  box.innerHTML = `<h4>${esc(n.label)}</h4>${n.lvl ? `<div class="top">${tsb(n.t)}${n.end != null ? ` – ${fmt(n.end)}` : ""}</div>` : ""}
    ${n.info && n.info !== n.label ? `<p>${inline(n.info)}</p>` : ""}
    ${said ? `<p class="muted small"><b>${t("map_said")}</b> „${esc(said)}”</p>` : ""}`;

}
function seek(s){
  const v = $("#vid");
  if (v) { v.currentTime = Number(s); v.play().catch(()=>{});
    const r = v.getBoundingClientRect(), visible = r.top >= 0 && r.bottom <= innerHeight;   // na jednym ekranie film jest zawsze widoczny
    if (!visible && mode !== "read") v.scrollIntoView({behavior:"smooth", block:"center"}); }

function renderChat(){
  const box = $("#msgs"); if (!box) return;
  box.innerHTML = cur.chat.map(m => m.rola === "user" ? `<div class="msg user">${esc(m.tekst)}</div>` : `<div class="msg bot">${md(m.tekst)}</div>`).join("");
}
async function ask(q){
  q = (q||"").trim(); if (!q) return;
  cur.chat.push({rola:"user", tekst:q}, {rola:"asystent", tekst:t("thinking")}); renderChat();
  try { const r = await api(`/api/zadania/${cur.id}/pytanie`, {method:"POST", body:JSON.stringify({pytanie:q})}); cur.chat = r.historia; }

$("#app").addEventListener("click", async e => {
  const s = e.target.closest("[data-seek]"); if (s) { e.preventDefault(); return seek(s.dataset.seek); }

$("#app").addEventListener("submit", e => { if (e.target.id === "askf") { e.preventDefault(); const i = $("#askq"); ask(i.value); i.value = ""; } });

async function poll(){

setInterval(() => document.querySelectorAll(".timer[data-start]").forEach(el => { if (el.dataset.start) el.textContent = "⏱ " + fmt(Date.now()/1000 - Number(el.dataset.start)); }), 1000);
