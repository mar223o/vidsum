<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VidSum</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{  /* ciemny (domyślnie, jak Vimeo/YouTube) */
  --bg:#0e0e10; --panel:#16161a; --card:#1d1d22; --ink:#f4f4f5; --muted:#9e9ea8; --line:#26262c; --line2:#35353d;
  --accent:#ff4d6a; --accent-soft:#3a1720; --accent-ink:#fff; --ok:#4ade80; --bad:#f87171; --warn:#fbbf24;
  --speech:#7aa7ff; --vision:#c4a1ff; --est:#fbbf24; --none:#8b8b95;
  --grad:linear-gradient(135deg,#3d6bff,#8e4dff 55%,#ff3d63);
  --serif:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif; --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:14px; color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f5f5f7; --panel:#ffffff; --card:#f0f0f3; --ink:#18181b; --muted:#6b6b76; --line:#e4e4e9; --line2:#d4d4dc;
  --accent:#e5354f; --accent-soft:#fde3e8; --accent-ink:#fff; --ok:#16a34a; --bad:#dc2626; --warn:#b45309;
  --speech:#2f5fd0; --vision:#7c3aed; --est:#b45309; --none:#71717a; color-scheme:light;
}
@media (prefers-color-scheme: light){
  :root[data-theme="system"]{
    --bg:#f5f5f7; --panel:#ffffff; --card:#f0f0f3; --ink:#18181b; --muted:#6b6b76; --line:#e4e4e9; --line2:#d4d4dc;
    --accent:#e5354f; --accent-soft:#fde3e8; --accent-ink:#fff; --ok:#16a34a; --bad:#dc2626; --warn:#b45309;
    --speech:#2f5fd0; --vision:#7c3aed; --est:#b45309; --none:#71717a; color-scheme:light; }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans)}
button{font:inherit;color:inherit}
a{color:var(--accent)}
/* ---------- nagłówek ---------- */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:10px 24px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{font:600 21px var(--serif);letter-spacing:-.01em;text-decoration:none;color:var(--ink)}
.logo i{color:var(--accent)}
nav{display:flex;gap:4px}
nav a{padding:6px 12px;border-radius:99px;text-decoration:none;color:var(--muted);font-size:14px}
nav a.on{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;justify-content:flex-end}
.chip{font-size:11.5px;padding:2px 9px;border-radius:99px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:currentColor}.chip.bad{color:var(--bad);border-color:currentColor}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 13px;border-radius:99px;cursor:pointer;font-size:12.5px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
main{max-width:1320px;margin:0 auto;padding:28px 20px 90px}
.eyebrow{font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.hand{font:italic 15px var(--serif);color:var(--accent)}
.label{font:600 10.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.rule{border:0;border-top:1px solid var(--ink);margin:6px 0 16px}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:99px;padding:6px 14px;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
/* ---------- strona główna ---------- */
.hero h1{font:400 clamp(30px,4.6vw,52px)/1.05 var(--serif);margin:6px 0 4px;letter-spacing:-.02em}
.hero h1 i{color:var(--accent)}
.hero p{color:var(--muted);margin:0 0 22px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
#drop{border:1.5px dashed var(--line2);border-radius:var(--r);padding:36px 16px;text-align:center;cursor:pointer;transition:.15s;background:var(--card)}
#drop.over{border-color:var(--accent);background:var(--accent-soft)}
#drop b{font:500 21px var(--serif);display:block;margin-bottom:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
textarea,input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
textarea{flex:1;min-width:220px;min-height:44px;resize:vertical}
details>summary{cursor:pointer;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
label.f{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.job{display:grid;gap:7px;padding:12px 0}
.job+.job{border-top:1px solid var(--line)}
.job-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.job-top .name{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font-size:11.5px;padding:1px 8px;border-radius:99px;border:1px solid currentColor}
.st.trwa{color:var(--warn)}.st.gotowe{color:var(--ok)}.st.blad{color:var(--bad)}.st.w_kolejce{color:var(--muted)}
.timer{font:600 12px var(--mono);color:var(--muted);white-space:nowrap}.stage{font-size:12px;color:var(--warn)}
.parts{display:flex;gap:6px;flex-wrap:wrap}.parts button{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer}
.parts button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.part{max-height:260px;overflow:auto;font-size:13.5px;line-height:1.5;background:var(--bg);border-radius:8px;padding:8px 12px}
.part div{display:flex;gap:10px}.part code{color:var(--muted);flex:none}
.quit{margin-left:6px;font-size:12px}
pre.log.full{max-height:340px}
pre.log{margin:0;font:12px/1.45 var(--mono);color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 10px;max-height:130px;overflow:auto;white-space:pre-wrap}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 0 12px}
.section-h h2{font:400 26px var(--serif);margin:0}
/* ---------- biblioteka ---------- */
.lib-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.lib-tools input{flex:1;min-width:200px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column}
.vcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.vcard .th{aspect-ratio:16/10;background:var(--line) center/cover no-repeat;position:relative}
.vcard .th .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font:600 11px var(--mono);padding:2px 6px;border-radius:6px}
.vcard .bd{padding:12px 14px 14px;display:grid;gap:5px}
.vcard h3{font:500 18px/1.2 var(--serif);margin:0}.vcard h3 i{color:var(--accent)}
.vcard p{margin:0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{display:inline-block;font:600 10.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);width:max-content}
.empty{color:var(--muted);font-size:14px;padding:18px 0}
/* ---------- wynik ---------- */
.modebar{display:flex;justify-content:center;margin:-8px 0 18px}
.r-head{max-width:860px;margin:0 auto 26px}
.r-head h1{font:400 clamp(34px,5.4vw,64px)/1.02 var(--serif);margin:8px 0 10px;letter-spacing:-.025em}
.r-head h1 i{display:block;color:var(--accent)}
.thesis{font:italic 19px/1.45 var(--serif);color:var(--accent);margin:12px 0 10px;padding-left:16%}
.meta{font:600 10.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.layout{display:grid;gap:30px;align-items:start}
.m-bal .layout{grid-template-columns:minmax(0,.95fr) minmax(0,1.35fr) minmax(0,1fr)}
.m-video .layout{grid-template-columns:minmax(0,2.1fr) minmax(0,1fr)}
.m-video .col-sum{grid-column:1/-1;order:3;max-width:860px}
.m-read .layout{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.m-read .col-sum{order:1}.m-read .col-mid{order:2}.m-read .col-break{grid-column:1/-1;order:3}
.m-read .col-mid .chatbox{display:none}
.summary p{margin:0 0 14px}
.summary p:first-child::first-letter{float:left;font:400 52px/0.85 var(--serif);color:var(--accent);padding:4px 8px 0 0}
blockquote.pull{margin:18px 0;padding:14px 0 14px 22px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);font:italic 17px/1.5 var(--serif);position:relative}
blockquote.pull::before{content:"“";position:absolute;left:0;top:10px;color:var(--accent);font:28px var(--serif)}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:14px 0;font-size:14px}
.note h4{margin:0 0 6px;font:500 16px var(--serif)}
.note ul{margin:4px 0;padding-left:18px}
/* odtwarzacz */
.player{border-radius:18px;overflow:hidden;background:#000;box-shadow:0 18px 40px -22px rgba(60,30,10,.5);position:relative}
.player video{display:block;width:100%;max-height:72vh;background:#000}
.player .nofilm{aspect-ratio:16/9;display:grid;place-items:center;color:#ddd;background:#222 center/contain no-repeat;font-size:13px}
.m-read .player video{max-height:42vh}
.tsb{font:600 12px var(--mono);color:var(--accent);background:var(--accent-soft);border:0;border-radius:99px;padding:1px 8px;cursor:pointer;white-space:nowrap}
.tsb:hover{background:var(--accent);color:var(--accent-ink)}
/* czat */
.chatbox{margin-top:18px}
.chatbox .hint{font:italic 18px var(--serif);margin:4px 0 12px}
.sugg{display:grid;gap:7px;margin-bottom:12px}
.sugg button{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:13.5px}
.sugg button:hover{border-color:var(--accent)}
.msgs{display:grid;gap:10px;margin-bottom:12px}
.msg{padding:10px 13px;border-radius:12px;font-size:14px}
.msg.user{background:var(--ink);color:var(--bg);justify-self:end;max-width:85%}
.msg.bot{background:var(--panel);border:1px solid var(--line)}
.msg.bot p{margin:0 0 6px}.msg.bot p:last-child{margin:0}
.ask{display:flex;gap:8px;background:var(--panel);border:1px solid var(--line2);border-radius:99px;padding:5px 5px 5px 14px}
.ask input{flex:1;border:0;background:none;padding:6px 0;outline:none}
.ask button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:99px;width:36px;height:36px;cursor:pointer;font-size:16px}
/* rozbicie (prawa kolumna) */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:8px 0 16px;scrollbar-width:thin}
.tabs button{border:0;background:none;padding:9px 10px;cursor:pointer;color:var(--muted);font-size:13.5px;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.big{font:italic 400 28px/1.15 var(--serif);color:var(--accent);margin:0 0 14px}
.items{display:grid;gap:10px}
.it{display:grid;grid-template-columns:34px 1fr;gap:6px 10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:.15s}
.it.now{border-color:var(--accent);background:var(--accent-soft)}
.it .n{font:italic 28px/1 var(--serif);color:var(--accent)}
.it h4{margin:2px 0 2px;font:italic 500 17px/1.25 var(--serif)}
.it p{margin:0;font-size:13.5px;color:var(--muted)}
.it .top{display:flex;gap:8px;align-items:center;justify-content:space-between}
.it .tag{font:600 9.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--card);padding:2px 7px;border-radius:99px}
.it.simple{grid-template-columns:62px 1fr;align-items:baseline}
.it.simple p{color:var(--ink);font:italic 15px var(--serif)}
.sub{margin:12px 0 6px;font:600 10.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ingr{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ingr li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line2);padding:5px 0;font-size:14px}
.ingr li b{font-weight:500}
.ingr li span{color:var(--muted);text-align:right}
.chk{display:flex;gap:10px;align-items:flex-start}
.chk input{margin-top:4px;accent-color:var(--accent)}
.chk.done p{text-decoration:line-through;opacity:.6}
.tr-line{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.tr-line.ocr{color:var(--vision);font-size:13px}
.frame{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.frame img{width:100%;border-radius:8px;display:block;background:var(--line);cursor:pointer}
.src{font-size:10.5px;padding:0 6px;border-radius:99px;border:1px solid currentColor;margin-left:5px;white-space:nowrap;vertical-align:1px}
.src.mowa{color:var(--speech)}.src.obraz{color:var(--vision)}.src.szacunek{color:var(--est)}.src.brak_danych{color:var(--none)}
.timing{margin:12px 0 4px;font-size:13px}
.trow{display:grid;grid-template-columns:100px 1fr 58px;gap:10px;align-items:center;margin:3px 0;color:var(--muted)}
.tbar{height:7px;background:var(--line);border-radius:99px;overflow:hidden}.tbar i{display:block;height:100%;background:var(--accent)}
.tval{text-align:right;font-family:var(--mono);color:var(--ink)}
.md h2{font:500 19px var(--serif);margin:18px 0 6px}.md h3{font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.md ul,.md ol{margin:4px 0;padding-left:20px}.md li{margin:3px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
/* ---------- na żywo ---------- */
.livebar{margin-top:14px;display:grid;gap:8px}
.livebar.err{color:var(--bad);font-size:14px}
.lsteps{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px}
.lstep{color:var(--muted);padding:2px 10px;border-radius:99px;border:1px solid var(--line)}
.lstep.done{color:var(--ok);border-color:transparent}
.lstep.now{color:var(--accent-ink);background:var(--accent);border-color:var(--accent);animation:pulse 1.6s ease-in-out infinite}
.lsep{width:14px;height:1px;background:var(--line2)}
.lnow{display:flex;gap:10px;align-items:baseline;font-size:12.5px;min-width:0}.lnow .muted{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes pulse{50%{opacity:.75}}
.skel{display:grid;gap:10px;margin:6px 0 14px}
.skel i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--line) 0%,var(--card) 50%,var(--line) 100%);background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.appear{animation:fi .35s ease both}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.appear,.skel i,.lstep.now{animation:none}}
.small{font-size:13px}
.rtime{font:500 11px var(--sans);letter-spacing:.04em;text-transform:none;color:var(--accent);margin-left:8px}
.player .nofilm{width:100%;max-height:72vh;background-size:cover;background-position:center}
.ph{background:rgba(0,0,0,.62);color:#fff;padding:6px 12px;border-radius:8px;font-size:13px;text-align:center;margin:12px}
.trbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12.5px;margin:-6px 0 10px}
.seg.small button{padding:3px 10px;font-size:12px}
.trtext{max-width:68ch}
.tr-line{line-height:1.6}
.summary{max-width:68ch;font-size:16px;line-height:1.65}
#res{overflow-anchor:auto}
/* ---------- 0.8.1: ciemny wygląd, logo, momenty z miniaturami ---------- */
.logo{display:inline-flex;align-items:center;gap:9px;font:700 20px var(--serif);letter-spacing:-.02em}
.logo img{border-radius:8px;display:block}
.logo i{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn.ico{padding:6px 11px}
.rule{border-top-color:var(--line2)}
.hand{display:none}
.panel,.it,.note,.frame{box-shadow:none}
.it.simple.mom{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center;padding:8px;border-radius:12px;cursor:pointer}
.it.simple.mom:hover,.it.simple.mom.now{background:var(--card)}
.mthumb{width:132px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#000;display:block}
.it.simple.mom p{margin:4px 0 0;font-size:15px}
.sumact{display:flex;gap:8px;margin:4px 0 14px}
.thesis{padding-left:0 !important}
.res{font-size:13px;margin:8px 0}.res b{color:var(--ink)}
@media (max-width:1100px){ .m-bal .layout{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)} .m-bal .col-sum{grid-column:1/-1;order:3} }
@media (max-width:760px){
  header{padding:10px 16px;gap:10px} main{padding:20px 16px 80px}
  .layout,.m-bal .layout,.m-video .layout,.m-read .layout{grid-template-columns:minmax(0,1fr)}
  .col-sum,.col-mid,.col-break{grid-column:auto!important;order:initial!important}
  .thesis{padding-left:0} .frame{grid-template-columns:90px 1fr}
  #res.live .col-mid, #res.live .col-sum .skel{display:none}   /* telefon w trakcie analizy: transkrypcja zaraz pod nagłówkiem */
}
</style>
</head>
<body>
<header>
  <a class="logo" href="#/"><img src="/icon.svg" alt="" width="28" height="28"><span>Vid<i>Sum</i></span></a>
  <nav><a href="#/" data-nav="home" data-i="nav_home"></a><a href="#/biblioteka" data-nav="lib" data-i="nav_lib"></a></nav>
  <div class="chips" id="chips"></div>
  <div class="seg lang"><button data-l="pl">PL</button><button data-l="en">EN</button></div>
  <button class="btn ico" id="theme" title="" aria-label="theme">☾</button>
  <button class="btn" id="inbrowser" data-i="open_browser" hidden></button>
  <button class="btn quit" id="quit" data-i="quit"></button>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
const T = new URLSearchParams(location.search).get("t") || "";
const I18N = {
 pl:{nav_home:"Analizuj",nav_lib:"Biblioteka",hero1:"Wrzuć film —",hero2:"powiem Ci, co z niego wynika.",
   hero_sub:"Przepis, trening, poradnik: mowa, napisy i obraz zamienione w konkretną listę do zrobienia.",
   drop:"Przeciągnij tu pliki wideo",drop_sub:"albo kliknij, aby wybrać (MP4, MOV, MKV, WEBM) — kilka naraz też",
   links_ph:"…albo wklej link(i) YouTube / Instagram / TikTok albo ścieżkę C:\\…\\film.mp4 (jeden w linii)",

function fmt(s){ s=Math.max(0,Math.round(s||0)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return (h? h+":"+String(m).padStart(2,"0") : String(m).padStart(2,"0"))+":"+String(x).padStart(2,"0"); }
const tsb = s => `<button class="tsb" data-seek="${s}">${fmt(s)}</button>`;
const src = z => z ? `<span class="src ${z.startsWith("mowa")?"mowa":z==="obraz"?"obraz":z==="szacunek"?"szacunek":"brak_danych"}">${esc(z)}</span>` : "";
function inline(x){ return esc(x).replace(/`(\d{1,2}:\d{2}(?::\d{2})?)`|\b(\d{1,2}:\d{2})\b/g, (m,a,b) => { const v=(a||b).split(":").map(Number); const s=v.reduce((p,c)=>p*60+c,0); return tsb(s); })
  .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\[(mowa\+obraz|mowa|obraz|szacunek)\]/g,(m,k)=>src(k)); }
function md(s){
  const lines = String(s||"").split("\n"); let out = "", list = null;
  const close = () => { if (list){ out += `</${list}>`; list = null; } };
  for (const l of lines){
    const h2 = l.match(/^#{1,2}\s+(.*)/), h3 = l.match(/^###\s+(.*)/), ul = l.match(/^\s*[-*]\s+(.*)/), ol = l.match(/^\s*\d+[.)]\s+(.*)/);
    if (ul || ol){ const k = ul ? "ul" : "ol"; if (list !== k){ close(); out += `<${k}>`; list = k; } out += `<li>${inline((ul||ol)[1])}</li>`; continue; }
    close();
    if (h3) out += `<h3>${inline(h3[1])}</h3>`; else if (h2) out += `<h2>${inline(h2[1])}</h2>`; else if (l.trim()) out += `<p>${inline(l)}</p>`;
  }
  close(); return out;
}

function partLabel(k){ return k.startsWith("tlumaczenie_") ? t("part_tl")+" ("+k.slice(12).toUpperCase()+")" : t("part_"+k); }
function partsHtml(j){
  const ks = (j.czesciowe || []).filter(k => ["transkrypcja","napisy","kadry"].includes(k) || k.startsWith("tlumaczenie_"));
  const live = j.status==="trwa" ? `<button data-part="${j.id}:log" class="${openParts.has(j.id+":log")?"on":""}">${esc(t("part_log"))}</button>` : "";
  if (!ks.length) return live ? `<div class="parts">${live}</div>` : "";
  const btns = live + ks.map(k => `<button data-part="${j.id}:${k}" class="${openParts.has(j.id+":"+k)?"on":""}">${esc(partLabel(k))}</button>`).join("");
  const panels = ks.filter(k => k !== "log").filter(k => openParts.has(j.id+":"+k)).map(k => {
    let d = (partCache[j.id]||{})[k];
    if (!d) return `<div class="part">…</div>`;

    return `<div class="part">${rows || "—"}</div>`;

  return `<div class="parts">${btns}</div>${panels}`;
}

function upload(file){
  const key = Math.random().toString(36).slice(2); uploads[key] = {name:file.name, pct:0}; renderHome();

  x.setRequestHeader("X-Token", T); x.setRequestHeader("X-Filename", encodeURIComponent(file.name));
  x.upload.onprogress = e => { if (e.lengthComputable){ uploads[key].pct = Math.round(100*e.loaded/e.total); renderHome(); } };
  x.onloadend = async () => {
    delete uploads[key];
    let j = null; try { j = JSON.parse(x.responseText); } catch {}
    if (j && j.id && !Object.keys(uploads).length && (location.hash === "#/" || location.hash === "")) {

    if (j && j.status !== "gotowe") { cur.live = true; cur.job = j; return refreshLive(); }

function resHtml(z){                    // zasoby karty z analizy (0.8.1)
  if (!z || !z.przed) return "";
  const g = z.przed, w = z.w_trakcie || {}, ms = [...((z.modele||{}).opis_kadrow||[]), ...((z.modele||{}).streszczenie||[])];
  return `<div class="res"><b>${t("res_gpu")}:</b> ${esc(g.karta)} · ${t("res_before")} <b>${g.zajete_mb} MB</b> / ${g.pamiec_mb} MB · ${t("res_free")} <b>${g.wolne_mb} MB</b>
    ${w.najmniej_wolnej_mb != null ? `<br>${t("res_min")} ${w.najmniej_wolnej_mb} MB` : ""}
    ${ms.length ? "<br>" + ms.map(m => `${esc(m.model)}: ${m.rozmiar_mb} MB, ${t("res_on")} ${m.na_karcie_proc}%`).join(" · ") : ""}
    ${(g.programy||[]).length ? `<br><span class="muted">${t("res_progs")}: ${g.programy.map(p => esc(p.nazwa)).join(", ")}</span>` : ""}
    ${g.zajete_mb > 1200 ? `<br><span style="color:var(--warn)">⚠ ${t("res_warn")}</span>` : ""}</div>`;
}
function readTime(d){
  const s = d.czas_czytania_s || Math.round(((d.streszczenie||[]).join(" ") + " " + (d.teza||"")).split(/\s+/).filter(Boolean).length / 190 * 60);
  return s ? `<span class="rtime">≈ ${s >= 60 ? Math.floor(s/60) + " min " + String(s%60).padStart(2,"0") + " s" : s + " s"} ${t("reading")}</span>` : "";
}
function sumHtml(r, d){
  const top = `<div class="hand">~ ${t("summary")} ~</div><div class="label">${t("summary")} ${d && d.streszczenie.length ? readTime(d) : ""}</div><hr class="rule">`;
  if (!d || !d.streszczenie.length) {
    if (cur.live) return top + `<div class="skel"><i></i><i></i><i></i><i></i><i style="width:55%"></i></div>
      <p class="muted small">${t(d?.partial ? "live_steps_ready" : "live_wait_sum")}</p>`;
    return top + (r.streszczenie ? `<div class="md">${md(r.streszczenie.markdown)}</div>` : `<p class="muted">${t("no_data")}</p>`);
  }
  return top + `<div class="summary">${d.streszczenie.map(p => `<p>${inline(p)}</p>`).join("")}</div>
    ${cur.live ? "" : `<div class="sumact"><button class="btn" data-a="copysum">⧉ ${t("copy_sum")}</button><button class="btn" data-a="trsum">文A ${t("tr_sum")}</button></div>`}
    ${d.do_zapamietania ? `<blockquote class="pull"><div class="label" style="margin-bottom:4px">${t("remember")}</div>${esc(d.do_zapamietania)}</blockquote>` : ""}
    ${d.szczera_ocena ? `<div class="note"><h4>${t("honest")}</h4>${inline(d.szczera_ocena)} ${src("szacunek")}</div>` : ""}
    ${d.czego_nie_wiadomo.length ? `<div class="note"><h4>${t("unknown")}</h4><ul>${d.czego_nie_wiadomo.map(x => `<li>${inline(x)}</li>`).join("")}</ul></div>` : ""}
    <details class="note"><summary>${t("how")}</summary>${timingHtml(r.czasy)}
      <p style="font-size:13px" class="muted">${t("engines")}: ${esc(r.ustawienia.whisper)} · ${esc(r.ustawienia.obraz)} · ${esc(r.ustawienia.streszczenie)}${d.metoda ? " · " + esc(d.metoda) : ""}</p>
      ${resHtml(r.zasoby)}
      ${r.luki.length ? `<p style="font-size:13px"><b>${t("gaps")}:</b><br>${r.luki.map(esc).join("<br>")}</p>` : ""}</details>`;
}
function playerHtml(r){
  const z = r.zrodlo, ar = z.szerokosc && z.wysokosc ? `aspect-ratio:${z.szerokosc}/${z.wysokosc};` : "";
  const poster = r.kadry?.[0]?.file ? fileUrl(cur.id, r.kadry[0].file) : "";
  if (cur.live) return `<div class="player"><div class="nofilm" style="${ar}background-image:url('${poster}')"><span class="ph">${t("live_video")}</span></div></div>`;
  return `<div class="player"><video id="vid" src="/api/zadania/${cur.id}/film?t=${T}" poster="${poster}" controls preload="metadata" playsinline></video></div>`;
}
function chatHtml(d){
  if (cur.live) return "";
  return `<div class="hand">~ ${t("chat")} ~</div><hr class="rule"><div class="hint">${t("chat_hint")}</div>
    <div class="msgs" id="msgs"></div>
    ${d?.pytania.length ? `<div class="sugg" id="sugg">${d.pytania.map(q => `<button data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>` : ""}
    <form class="ask" id="askf"><input id="askq" placeholder="${esc(t("ask_ph"))}" autocomplete="off"><button aria-label="send">↑</button></form>`;
}
/* podmiana treści sekcji tylko, gdy się zmieniła; zwraca true, gdy podmieniono */
function put(sel, html, skel){
  const el = $(sel); if (!el || el._h === html) return false;
  const wasSkel = el._skel; el.innerHTML = html; el._h = html; el._skel = !!skel;
  if (wasSkel && !skel) { el.classList.remove("appear"); void el.offsetWidth; el.classList.add("appear"); }
  return true;
}
/* czytany fragment zostaje w miejscu: zapamiętaj pierwszy widoczny element z czasem i po zmianie przewiń o różnicę */
function stable(fn){
  let a = null;
  if (window.scrollY > 0) {
    for (const box of ["tabc", "csum"]) {
      for (const el of document.querySelectorAll(`#${box} [data-t]`)) {
        const top = el.getBoundingClientRect().top;
        if (top >= 70 && top < innerHeight) { a = {box, t:Number(el.dataset.t), top}; break; }
      }
      if (a) break;
    }
  }
  fn();
  if (!a) return;
  let best = null;
  for (const el of document.querySelectorAll(`#${a.box} [data-t]`)) if (Number(el.dataset.t) <= a.t + 0.01) best = el;
  if (best) { const d = best.getBoundingClientRect().top - a.top; if (Math.abs(d) > 1) window.scrollBy(0, d); }
}
function renderResult(){
  const r = cur.r, d = data(), tl = tabsFor(d);
  if (!tab || !tl.some(x => x[0] === tab)) tab = cur.live ? "tr" : tl[0][0];
  // koniec analizy: jeśli nikt nie wybierał zakładki i strona jest na górze — pokaż najpierw wynik (kroki/najważniejsze)
  if (!cur.live && cur.wasLive && cur.tabAuto && window.scrollY < 200) tab = tl[0][0];
  cur.wasLive = cur.live;
  let root = $("#res");
  if (!root || root.dataset.id !== cur.id || root.dataset.mode !== mode) {
    $("#app").innerHTML = `<div id="res" class="m-${mode}" data-id="${cur.id}" data-mode="${mode}">
      <div class="modebar"><div class="seg" id="modes"><button data-m="video">◉ ${t("m_video")}</button><button data-m="bal">≡ ${t("m_bal")}</button><button data-m="read">▤ ${t("m_read")}</button></div></div>
      <div class="r-head" id="rhead"></div>
      <div class="layout">
        <section class="col-sum" id="csum"></section>
        <section class="col-mid"><div id="cplayer"></div><div class="chatbox" id="cchat"></div></section>
        <section class="col-break"><div class="hand">~ ${t("breakdown")} ~</div><div class="label">${t("breakdown")}</div><hr class="rule">
          <div class="tabs" id="tabs"></div><div id="tabc"></div></section>
      </div></div>`;
    document.querySelectorAll("#modes button").forEach(b => b.classList.toggle("on", b.dataset.m === mode));
  }
  $("#res").classList.toggle("live", !!cur.live);
  stable(() => {
    put("#rhead", headHtml(r, d));
    put("#csum", sumHtml(r, d), cur.live && !(d && d.streszczenie.length));
    if (put("#cplayer", playerHtml(r))) {
      const v = $("#vid");
      if (v) {
        const poster = v.getAttribute("poster");
        const z = r.zrodlo, ar = z.szerokosc && z.wysokosc ? `aspect-ratio:${z.szerokosc}/${z.wysokosc};` : "";
        v.addEventListener("error", () => { v.parentElement.innerHTML = `<div class="nofilm" style="${ar}background-image:url('${poster}')"><span class="ph">${t("no_film")}</span></div>`; });
        v.addEventListener("timeupdate", highlight);
      }
    }
    if (put("#cchat", chatHtml(d))) renderChat();
    put("#tabs", tl.map(([k,lab]) => `<button data-tab="${k}" class="${k===tab?"on":""}">${lab}</button>`).join(""));
    put("#tabc", renderTab(d));
  });
}
function highlight(){
  const v = $("#vid"); if (!v) return; const now = v.currentTime;
  const els = [...document.querySelectorAll("#tabc [data-t]")]; let best = null;
  for (const el of els) if (Number(el.dataset.t) <= now + 0.3) best = el;
  els.forEach(el => el.classList.toggle("now", el === best && !v.paused));
}
function seek(s){
  const v = $("#vid");
  if (v) { v.currentTime = Number(s); v.play().catch(()=>{}); if (mode !== "read") v.scrollIntoView({behavior:"smooth", block:"center"}); }
}
function renderChat(){
  const box = $("#msgs"); if (!box) return;
  box.innerHTML = cur.chat.map(m => m.rola === "user" ? `<div class="msg user">${esc(m.tekst)}</div>` : `<div class="msg bot">${md(m.tekst)}</div>`).join("");
}
async function ask(q){
  q = (q||"").trim(); if (!q) return;
  cur.chat.push({rola:"user", tekst:q}, {rola:"asystent", tekst:t("thinking")}); renderChat();
  try { const r = await api(`/api/zadania/${cur.id}/pytanie`, {method:"POST", body:JSON.stringify({pytanie:q})}); cur.chat = r.historia; }
  catch(e){ cur.chat.pop(); cur.chat.push({rola:"asystent", tekst:"✕ " + e.message}); }
  renderChat();
}
$("#app").addEventListener("click", async e => {
  const s = e.target.closest("[data-seek]"); if (s) { e.preventDefault(); return seek(s.dataset.seek); }
  const m = e.target.closest("#modes button"); if (m) { mode = m.dataset.m; try{ localStorage.setItem("vs_mode", mode); }catch{} return renderResult(); }
  const tb = e.target.closest("#tabs button"); if (tb) { tab = tb.dataset.tab; cur.tabAuto = false; return renderResult(); }
  const tlb = e.target.closest("#trl button"); if (tlb) { cur.trLang = tlb.dataset.tl; return stable(() => put("#tabc", renderTab(data()))); }
  const q = e.target.closest("#sugg button"); if (q) return ask(q.dataset.q);
  if (e.target.id === "ocrt") { cur.showOcr = e.target.checked; return stable(() => put("#tabc", renderTab(data()))); }
  const ck = e.target.closest(".chk input"); if (ck) { ck.closest(".chk").classList.toggle("done", ck.checked); return; }
  const a = e.target.closest("[data-a]"); if (!a || !cur) return;
  try {
    if (a.dataset.a === "folder") await api(`/api/zadania/${cur.id}/otworz`, {method:"POST"});
    if (a.dataset.a === "copysum") { const d = data(); await navigator.clipboard.writeText([d.tytul, d.teza, ...d.streszczenie, d.do_zapamietania].filter(Boolean).join("\n\n")); toast(t("copied")); return; }
    if (a.dataset.a === "trsum") { ask(t("tr_sum_q")); const c = $("#cchat"); if (c) c.scrollIntoView({behavior:"smooth", block:"center"}); return; }
    if (a.dataset.a === "copy") { const r = await fetch(fileUrl(cur.id, "prompt_dla_claude.md")); await navigator.clipboard.writeText(await r.text()); toast(t("copied")); }
    if (a.dataset.a === "claude") { a.disabled = true; toast(t("claude_wait")); await api(`/api/zadania/${cur.id}/claude`, {method:"POST"});
      cur.r = await api(`/api/zadania/${cur.id}/plik/analiza.json`); a.disabled = false; renderResult(); }
  } catch(err){ a.disabled = false; toast(err.message); }
});
$("#app").addEventListener("submit", e => { if (e.target.id === "askf") { e.preventDefault(); const i = $("#askq"); ask(i.value); i.value = ""; } });

/* ---------- start ---------- */
async function poll(){
  try { jobs = await api("/api/zadania"); } catch { return; }
  for (const id of new Set([...openParts].map(k => k.split(":")[0])))     // otwarte podglądy — świeże dane
    if (jobs.some(j => j.id === id && j.status === "trwa")) { try { partCache[id] = await api(`/api/zadania/${id}/czesciowe`); } catch {} }
  const h = location.hash || "#/";
  if (h.startsWith("#/wynik/") && cur && cur.live) return refreshLive();
  if (h === "#/" || h === "") renderHome(); else if (h.startsWith("#/biblioteka") && !document.activeElement?.matches("#libq")) renderLib();
}
setInterval(() => document.querySelectorAll(".timer[data-start]").forEach(el => { if (el.dataset.start) el.textContent = "⏱ " + fmt(Date.now()/1000 - Number(el.dataset.start)); }), 1000);
(async () => {
  try { mode = localStorage.getItem("vs_mode") || "video"; } catch {}
  try { settings = await api("/api/ustawienia"); L = settings.jezyk_ui || "pl"; } catch {}
  try { jobs = await api("/api/zadania?skanuj=1"); } catch {}
  applyLang(); loadStatus();
  setInterval(poll, 1500); setInterval(loadStatus, 20000);
})();
</script>
