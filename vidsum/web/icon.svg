  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <path d="M40 76 Q40 56 58 66 L126 110 Q140 128 126 146 L58 190 Q40 200 40 180 Z" fill="url(#am)"/>
