name: Windows — testy i budowa VidSum

# Wydanie automatyczne (repozytorium publiczne — budowa na maszynach GitHuba jest darmowa): gdy na main trafi nowa
# wersja w vidsum/__init__.py, a wydania v<wersja> jeszcze nie ma (albo nie ma w nim instalatora), GitHub buduje
# instalator, paczkę aktualizacji i sam publikuje wydanie. Tag tworzy tu GitHub, nie człowiek.
on:
  push:
    branches: [main]
    paths: ["vidsum/__init__.py", ".github/workflows/windows.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # tworzenie tagu i wydania

concurrency:
  group: wydanie
  cancel-in-progress: false

jobs:
  wersja:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.v.outputs.ver }}
      need: ${{ steps.v.outputs.need }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' vidsum/__init__.py)
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          # wydanie już kompletne (jest instalator) — nic nie budujemy
          if gh release view "v$ver" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "VidSum-Setup-$ver.exe"; then
            echo "need=false" >> "$GITHUB_OUTPUT"; echo "v$ver już wydane"
          else
            echo "need=true" >> "$GITHUB_OUTPUT"; echo "buduję v$ver"
          fi

  build:
    needs: wersja
    if: needs.wersja.outputs.need == 'true'
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pobierz ffmpeg (BtbN, kompilacja LGPL)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = Invoke-RestMethod -Headers @{Authorization = "Bearer $env:GH_TOKEN"} `
            "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest"
          $asset = $rel.assets | Where-Object { $_.name -match '^ffmpeg-n\d+\.\d+-latest-win64-lgpl-\d+\.\d+\.zip$' } |
            Sort-Object name -Descending | Select-Object -First 1
          if (-not $asset) { throw "Nie znaleziono paczki ffmpeg" }
          Write-Host "ffmpeg: $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $bin = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force ffbin | Out-Null
          Copy-Item "$($bin.DirectoryName)\ffmpeg.exe", "$($bin.DirectoryName)\ffprobe.exe" ffbin\
          Copy-Item (Get-ChildItem ffmpeg_tmp -Recurse -Filter LICENSE.txt | Select-Object -First 1).FullName ffbin\FFMPEG-LICENSE.txt
          "$PWD\ffbin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          $asset.name | Out-File -Encoding utf8 ffbin\FFMPEG-VERSION.txt

      - name: Zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: PyInstaller z własnym modułem startowym (kompilacja ze źródeł)
        # Gotowy moduł startowy z PyPI jest identyczny w tysiącach programów (także szkodliwych),
        # dlatego antywirusy często go flagują. Kompilacja ze źródeł daje unikalny plik.
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: pip install --no-binary pyinstaller pyinstaller==6.22.3

      - name: Testy (pytest na Windows)
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q -rs

      # ---------------- wariant A: VidSum.exe (PyInstaller) ----------------
      - name: "A: budowa VidSum.exe"
        working-directory: packaging
        run: pyinstaller vidsum.spec --noconfirm --distpath ..\dist --workpath ..\build

      - name: "A: ffmpeg i instrukcja"
        run: |
          New-Item -ItemType Directory -Force dist\VidSum\bin | Out-Null
          Copy-Item ffbin\* dist\VidSum\bin\
          Copy-Item packaging\CZYTAJ_MNIE.txt dist\VidSum\
          Copy-Item -Recurse skill dist\VidSum\skill
          Copy-Item docs\licencje.md, docs\format_json.md dist\VidSum\

      # ---------------- wariant B: oficjalny Python z python.org (podpisany) ----------------
      - name: "B: paczka z podpisanym Pythonem (bez PyInstallera)"
        run: |
          $v = python -c "import platform; print(platform.python_version())"
          $P = "portable\VidSum"
          New-Item -ItemType Directory -Force $P | Out-Null
          Invoke-WebRequest "https://www.python.org/ftp/python/$v/python-$v-embed-amd64.zip" -OutFile embed.zip
          Expand-Archive embed.zip -DestinationPath "$P\python"
          $pth = Get-ChildItem "$P\python" -Filter "python*._pth" | Select-Object -First 1
          $zipname = (Get-ChildItem "$P\python" -Filter "python3*.zip" | Select-Object -First 1).Name
          # ścieżki: biblioteka standardowa, folder programu (..) i site-packages
          Set-Content $pth.FullName "$zipname`r`n.`r`n..`r`nLib\site-packages`r`nimport site" -Encoding ascii
          pip install --no-compile --target "$P\python\Lib\site-packages" -r requirements.txt
          Copy-Item -Recurse vidsum "$P\vidsum"
          Get-ChildItem "$P\vidsum" -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          # odcisk bibliotek: aktualizacja „samego kodu” tylko, gdy biblioteki są takie same (inaczej pełny instalator)
          $req = (Get-FileHash requirements.txt -Algorithm SHA256).Hash.ToLower()
          $deps = "$req-py$v"
          $ver0 = (Select-String -Path vidsum\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "{`"wersja`": `"$ver0`", `"zaleznosci`": `"$deps`"}" | Out-File -Encoding ascii "$P\vidsum\_build.json"
          "DEPS=$deps" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          New-Item -ItemType Directory -Force "$P\bin" | Out-Null
          Copy-Item ffbin\* "$P\bin\"
          Copy-Item packaging\VidSum.cmd, "packaging\VidSum Start.cmd", packaging\CZYTAJ_MNIE.txt, docs\licencje.md, docs\format_json.md $P
          Copy-Item -Recurse skill "$P\skill"
          $sig = Get-AuthenticodeSignature "$P\python\python.exe"
          Write-Host "Podpis python.exe: $($sig.Status) — $($sig.SignerCertificate.Subject)"

      # ---------------- testy dymne obu wariantów ----------------
      - name: Test dymny (bez Pythona i ffmpeg w PATH)
        run: |
          $env:PATH = "C:\Windows\System32;C:\Windows"   # tylko to, co ma każdy Windows
          $runs = @(
            @{ name = "A (exe)"; cmd = "$PWD\dist\VidSum\VidSum.exe" },
            @{ name = "B (python.org)"; cmd = "$PWD\portable\VidSum\VidSum.cmd" }
          )
          foreach ($r in $runs) {
            Write-Host "=== $($r.name) ==="
            & $r.cmd --version
            if ($LASTEXITCODE -ne 0) { throw "$($r.name): --version nie działa" }
            $out = "$env:RUNNER_TEMP\wyniki ąę $($r.name.Substring(0,1))"
            & $r.cmd "tests\data\Filmy testowe ąęś\przepis z mową.mp4" -o $out --whisper tiny --obraz brak --streszczenie brak
            if ($LASTEXITCODE -ne 0) { throw "$($r.name): analiza nie działa" }
            $json = Get-ChildItem $out -Recurse -Filter analiza.json | Select-Object -First 1
            $j = Get-Content $json.FullName -Raw -Encoding utf8 | ConvertFrom-Json
            Write-Host "Segmenty mowy: $($j.transkrypcja.segmenty.Count); kadry: $($j.kadry.Count); silnik: $($j.ustawienia.whisper)"
            $j.transkrypcja.segmenty | ForEach-Object { Write-Host ("  {0,6} {1}" -f $_.start, $_.text) }
            if ($j.kadry.Count -lt 3 -or $j.transkrypcja.segmenty.Count -lt 1) { throw "$($r.name): zły wynik" }
            # film testowy ma wypalone napisy „Krok 1…”, „Krok 2…” — OCR MUSI je odczytać (0.4.0: w .exe brakowało PIL)
            Write-Host "Napisy OCR: $($j.napisy_ekranowe.Count) — $(($j.napisy_ekranowe | ForEach-Object { $_.text }) -join ' | ')"
            if ($j.napisy_ekranowe.Count -lt 3) { throw "$($r.name): OCR nie odczytał napisów" }
          }

      - name: Test dymny interfejsu (oba warianty)
        run: |
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $runs = @(
            @{ name = "A"; file = "$PWD\dist\VidSum\VidSum.exe"; port = 8765 },
            @{ name = "B"; file = "$PWD\portable\VidSum\VidSum.cmd"; port = 8766 }
          )
          foreach ($r in $runs) {
            $p = Start-Process $r.file -ArgumentList "--ui","--port","$($r.port)","--bez-przegladarki","--token","ci" -PassThru
            Start-Sleep 10
            try {
              $page = Invoke-WebRequest "http://127.0.0.1:$($r.port)/" -UseBasicParsing
              if ($page.Content -notmatch "VidSum") { throw "brak strony" }
              $st = Invoke-RestMethod "http://127.0.0.1:$($r.port)/api/status" -Headers @{"X-Token"="ci"}
              Write-Host "$($r.name) status: $($st | ConvertTo-Json -Compress)"
              if (-not $st.ffmpeg) { throw "ffmpeg niewidoczny" }
              try { Invoke-WebRequest "http://127.0.0.1:$($r.port)/api/status" -UseBasicParsing | Out-Null; throw "brak ochrony tokenem" }
              catch { if ($_.Exception.Response.StatusCode.value__ -ne 403) { throw } }
            } finally {
              Stop-Process $p -Force -ErrorAction SilentlyContinue
              Get-Process python, VidSum -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            }
          }

      - name: "Start bez okna konsoli (VidSum Start) i wyłączanie przyciskiem „Zakończ”"
        run: |
          $runs = @(
            @{ name = "A"; file = "$PWD\dist\VidSum\VidSum Start.exe" },
            @{ name = "B"; file = "$PWD\portable\VidSum\VidSum Start.cmd" }
          )
          foreach ($r in $runs) {
            Start-Process $r.file
            $ok = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep 1
              try { if ((Invoke-WebRequest "http://127.0.0.1:8765/" -UseBasicParsing -TimeoutSec 2).Content -match "VidSum") { $ok = $true; break } } catch {}
            }
            if (-not $ok) { throw "$($r.name): VidSum Start nie uruchomił interfejsu" }
            $proc = Get-CimInstance Win32_Process | Where-Object { $_.Name -match "VidSum Start|pythonw" }
            Write-Host "$($r.name): działa w tle jako: $(($proc | ForEach-Object { $_.Name }) -join ', ')"
            $tok = (Get-Content "$env:LOCALAPPDATA\VidSum\token.txt" -Raw).Trim()
            Invoke-RestMethod -Method Post "http://127.0.0.1:8765/api/zakoncz" -Headers @{"X-Token"=$tok} | Out-Null
            Start-Sleep 3
            $alive = $true
            try { Invoke-WebRequest "http://127.0.0.1:8765/" -UseBasicParsing -TimeoutSec 2 | Out-Null } catch { $alive = $false }
            if ($alive) { throw "$($r.name): przycisk Zakoncz nie wylaczyl programu" }
            Write-Host "$($r.name): wylaczony przyciskiem Zakoncz - OK"
          }
          Get-Content "$env:LOCALAPPDATA\VidSum\vidsum.log" -Tail 5

      - name: Test dymny serwera MCP (oba warianty)
        run: |
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $init = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci"}}}'
          $list = '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          foreach ($f in @("$PWD\dist\VidSum\VidSum.exe", "$PWD\portable\VidSum\VidSum.cmd")) {
            $out = ($init, $list) | & $f --mcp
            Write-Host "MCP $f :"; $out | ForEach-Object { Write-Host "  $_" }
            $r2 = $out | Where-Object { $_ -match '"id": ?2' } | Select-Object -First 1 | ConvertFrom-Json
            if ($r2.result.tools.Count -ne 3) { throw "MCP: zła lista narzędzi ($f)" }
            if (($out | Where-Object { $_ -notmatch '^\{' }).Count -gt 0) { throw "MCP: śmieci na stdout ($f)" }
          }

      # ---------------- faza 7: biblioteki CUDA dla Whispera na GPU ----------------
      - name: Pamięć podręczna bibliotek CUDA
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\VidSum\cuda
          key: cuda-cublas12.8.4.1-cudnn9.10.2.21
      - name: "Pobranie i załadowanie bibliotek CUDA (VidSum.exe --pobierz-cuda; runner nie ma karty NVIDIA)"
        run: |
          & "$PWD\dist\VidSum\VidSum.exe" --pobierz-cuda
          if ($LASTEXITCODE -ne 0) { throw "biblioteki CUDA nie dają się załadować" }
          Get-ChildItem "$env:LOCALAPPDATA\VidSum\cuda" | ForEach-Object { Write-Host ("  {0,-45} {1,8:N0} MB" -f $_.Name, ($_.Length / 1MB)) }
          # ten sam test w wariancie z Pythonem (biblioteki już pobrane — tylko ładowanie)
          & "$PWD\portable\VidSum\VidSum.cmd" --pobierz-cuda
          if ($LASTEXITCODE -ne 0) { throw "B: biblioteki CUDA nie dają się załadować" }

      - name: ZIP + sha256 (oba warianty)
        run: |
          $ver = (& "dist\VidSum\VidSum.exe" --version).Split(" ")[1]
          $a = "VidSum-$ver-windows-x64.zip"
          $b = "VidSum-$ver-windows-x64-python.zip"
          7z a -tzip -mx=7 $a .\dist\VidSum | Out-Null
          7z a -tzip -mx=7 $b .\portable\VidSum | Out-Null
          foreach ($z in @($a, $b)) {
            $h = (Get-FileHash $z -Algorithm SHA256).Hash.ToLower()
            "$h  $z" | Out-File -Encoding ascii "$z.sha256"
            Write-Host "$z  $([math]::Round((Get-Item $z).Length/1MB)) MB  sha256 $h"
          }
          "ZIP_A=$a" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "ZIP_B=$b" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: "C: paczka aktualizacji (sam kod) + instalator (Inno Setup)"
        run: |
          $ver = (& "dist\VidSum\VidSum.exe" --version).Split(" ")[1]
          $c = "VidSum-$ver-aktualizacja.zip"
          Push-Location portable\VidSum
          7z a -tzip -mx=9 "..\..\$c" vidsum "VidSum Start.cmd" VidSum.cmd CZYTAJ_MNIE.txt | Out-Null
          Pop-Location
          "{`"wersja`": `"$ver`", `"zaleznosci`": `"$env:DEPS`"}" | Out-File -Encoding ascii "VidSum-$ver-aktualizacja.json"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=$ver" "/DSourceDir=$PWD\portable\VidSum" "/O$PWD" packaging\vidsum.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup: błąd $LASTEXITCODE" }
          $s = "VidSum-Setup-$ver.exe"
          foreach ($z in @($c, "VidSum-$ver-aktualizacja.json", $s)) {
            $h = (Get-FileHash $z -Algorithm SHA256).Hash.ToLower()
            "$h  $z" | Out-File -Encoding ascii "$z.sha256"
            Write-Host "$z  $([math]::Round((Get-Item $z).Length/1MB, 1)) MB  sha256 $h"
          }
          "ZIP_C=$c" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "META_C=VidSum-$ver-aktualizacja.json" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "SETUP=$s" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: "Test instalatora i podmiany kodu"
        run: |
          $dir = "$env:RUNNER_TEMP\VidSum inst ąę"
          $p = Start-Process -FilePath ".\$env:SETUP" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "instalator: kod $($p.ExitCode)" }
          & "$dir\python\python.exe" -m vidsum --version
          if ($LASTEXITCODE -ne 0) { throw "zainstalowany VidSum nie działa" }
          if (-not (Test-Path "$dir\vidsum\_build.json")) { throw "brak _build.json" }
          # okno programu: pywebview + .NET (pythonnet) + WebView2 w zainstalowanym Pythonie
          & "$dir\python\python.exe" -c "import webview; from webview.platforms import winforms; print('okno programu: ok')"
          if ($LASTEXITCODE -ne 0) { throw "okno programu (pywebview/WebView2) nie działa w instalacji" }
          # ikona VidSum w skrócie (Menu Start) i plik ikony w instalacji
          if (-not (Test-Path "$dir\vidsum\web\vidsum.ico")) { throw "brak vidsum.ico w instalacji" }
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\VidSum\VidSum.lnk"
          if (Test-Path $lnk) {
            $ic = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).IconLocation
            Write-Host "ikona skrótu: $ic"
            if ($ic -notlike "*vidsum.ico*") { throw "skrót bez ikony VidSum: $ic" }
          } else { Write-Host "brak skrótu w Menu Start (instalacja cicha) — pomijam sprawdzenie ikony" }
          # aktualizacja samego kodu na zainstalowanej kopii: paczka C z podmienioną wersją 9.9.9
          $t = "$env:RUNNER_TEMP\akt"; New-Item -ItemType Directory -Force $t | Out-Null
          Expand-Archive $env:ZIP_C -DestinationPath $t -Force
          (Get-Content "$t\vidsum\__init__.py" -Raw) -replace '__version__ = ".+?"', '__version__ = "9.9.9"' | Set-Content "$t\vidsum\__init__.py" -Encoding utf8
          New-Item -ItemType File "$dir\vidsum\stary_plik.py" -Force | Out-Null
          Compress-Archive -Path "$t\*" -DestinationPath "$env:RUNNER_TEMP\akt999.zip" -Force
          & "$dir\python\python.exe" -c "import sys; from pathlib import Path; from vidsum import update; update.swap_code(Path(sys.argv[1]), '9.9.9', Path(sys.argv[2]))" "$env:RUNNER_TEMP\akt999.zip" "$dir"
          $v = & "$dir\python\python.exe" -m vidsum --version
          Write-Host "po podmianie: $v"
          if ($v -ne "VidSum 9.9.9") { throw "podmiana kodu nie zadziałała" }
          if (Test-Path "$dir\vidsum\stary_plik.py") { throw "stary plik został" }
          $un = Get-ChildItem $dir -Filter "unins*.exe" | Select-Object -First 1
          $p = Start-Process -FilePath $un.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait -PassThru
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\vidsum"); $i++) { Start-Sleep 1 }   # odinstalowanie działa z kopii w TEMP
          if (Test-Path "$dir\vidsum") { throw "odinstalowanie zostawiło kod" }
          Write-Host "instalacja, aktualizacja kodu i odinstalowanie: OK"

      - name: Skan Windows Defender (oba warianty)
        continue-on-error: true
        run: |
          Update-MpSignature -ErrorAction SilentlyContinue
          $s = Get-MpComputerStatus
          Write-Host "Defender: sygnatury $($s.AntivirusSignatureVersion) z $($s.AntivirusSignatureLastUpdated); silnik $($s.AMEngineVersion)"
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          $bad = 0
          foreach ($p in @("$PWD\dist\VidSum", "$PWD\portable\VidSum", "$PWD\$env:ZIP_A", "$PWD\$env:ZIP_B", "$PWD\$env:SETUP")) {
            & $mp -Scan -ScanType 3 -File $p -DisableRemediation | Out-Host
            Write-Host "Skan $p → kod $LASTEXITCODE (0 = brak zagrożeń, 2 = wykryto)"
            if ($LASTEXITCODE -ne 0) { $bad++ }
          }
          Get-MpThreatDetection -ErrorAction SilentlyContinue | Format-List | Out-Host
          if ($bad) { throw "Defender coś wykrył" }

      - uses: actions/upload-artifact@v4
        continue-on-error: true      # limit miejsca na artefakty nie może blokować wydania (Release)
        with:
          name: VidSum-windows-x64-exe
          path: |
            ${{ env.ZIP_A }}
            ${{ env.ZIP_A }}.sha256
          retention-days: 7

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: VidSum-windows-x64-python
          path: |
            ${{ env.ZIP_B }}
            ${{ env.ZIP_B }}.sha256
          retention-days: 7

      - name: Release (tag v<wersja> tworzy GitHub)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.wersja.outputs.ver }}
        run: |
          $files = @($env:SETUP, "$env:SETUP.sha256", $env:ZIP_C, "$env:ZIP_C.sha256", $env:META_C, "$env:META_C.sha256",
                     $env:ZIP_A, "$env:ZIP_A.sha256", $env:ZIP_B, "$env:ZIP_B.sha256")
          $notes = "RAPORT_$($env:TAG.TrimStart('v')).md"
          if (-not (Test-Path $notes)) { $notes = "RAPORT_FAZA2.md" }
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            # najpierw puste wydanie (tworzy tag na tym commicie), potem pliki po jednym
            gh release create $env:TAG --target $env:GITHUB_SHA --title "VidSum $env:TAG" --notes-file $notes --latest
            if ($LASTEXITCODE -ne 0) { throw "nie udało się utworzyć wydania $env:TAG" }
          }
          # po jednym pliku, z ponowieniem: duże pliki wysyłane naraz kończyły się „HTTP 408 Upload body timed out”
          foreach ($f in $files) {
            $ok = $false
            for ($i = 1; $i -le 4 -and -not $ok; $i++) {
              gh release upload $env:TAG $f --clobber
              if ($LASTEXITCODE -eq 0) { $ok = $true } else { Write-Host "ponawiam $f ($i)"; Start-Sleep (15 * $i) }
            }
            if (-not $ok) { throw "nie udało się wysłać $f" }
          }
