# Pomiar streszczenia: stara wersja kodu (0.7.5) vs nowa, kilka powtórzeń na tej samej osi czasu (frytki).
name: pomiar-streszczenia
on:
  workflow_dispatch:
    inputs:
      stara:
        description: commit starej wersji
        default: c1b6ae1
      pomin_stara:
        description: pomiń starą wersję (już zmierzona)
        type: boolean
        default: false
      zakres:
        description: "frytki (stary pomiar) | filmy (4 filmy z 0.11.9, kontrola jakości) | wszystko"
        default: filmy
permissions:
  contents: read
jobs:
  # 0.12.0: streszczanie i tłumaczenie na prawdziwym modelu dla filmów z komputera użytkownika (tests/data/filmy_0119)
  filmy:
    if: inputs.zakres != 'frytki'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        film: [tortilla, pancake_touch, wisdm_moda, dokument_ambasada]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 30); do curl -sf localhost:11434/api/tags && break; sleep 1; done
          ollama pull gemma3:4b
      - name: Pomiar
        run: python tests/bench/story_bench.py gemma3:4b --film ${{ matrix.film }} --wyniki wyniki
      - name: Podsumowanie
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, glob
          for f in glob.glob("wyniki/*.json"):
              d = json.load(open(f, encoding="utf-8"))
              print(f"### {d['film']} — kontrola {d['wynik']}/100, streszczenie {d['czas_streszczenia_s']} s, tłumaczenie {d['czas_tlumaczenia_s']} s\n")
              for i in d["kontrola"]:
                  print(f"- {i['poziom']} `{i['kod']}` {i['opis']}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "filmy-${{ matrix.film }}", path: wyniki/}

  pomiar:
    if: inputs.zakres != 'filmy'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        tryb:
          - {etykieta: stara-0.7.5, kod: stara, rownolegle: 1}
          - {etykieta: nowa-1naraz, kod: nowa, rownolegle: 1}
          - {etykieta: nowa-3naraz, kod: nowa, rownolegle: 3}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Stara wersja kodu obok
        if: matrix.tryb.kod == 'stara'
        run: git worktree add ../stara "${{ github.event.inputs.stara || 'c1b6ae1' }}"
      - name: Ollama
        if: matrix.tryb.kod != 'stara' || !inputs.pomin_stara
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          OLLAMA_NUM_PARALLEL=${{ matrix.tryb.rownolegle }} nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 30); do curl -sf localhost:11434/api/tags && break; sleep 1; done
          ollama pull gemma3:4b
      - name: Pomiar
        if: matrix.tryb.kod != 'stara' || !inputs.pomin_stara
        run: |
          KOD=""; [ "${{ matrix.tryb.kod }}" = "stara" ] && KOD="--kod $(cd ../stara && pwd)"
          python tests/bench/summary_bench.py gemma3:4b --powtorzen 3 --rownolegle ${{ matrix.tryb.rownolegle }} \
            --wyniki wyniki --etykieta ${{ matrix.tryb.etykieta }} $KOD
      - name: Podsumowanie
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, glob
          for f in glob.glob("wyniki/*.json"):
              if f.endswith("_kroki.json"): continue
              d = json.load(open(f, encoding="utf-8"))
              print(f"### {d['etykieta']}\n\n| # | fakty | w krokach | kroki | rozdz. | zmyślenia | czas | brak |\n|---|---|---|---|---|---|---|---|")
              for r in d["przebiegi"]:
                  print(f"| {r['powtorzenie']} | {r['fakty']}/{r['z']} | {r['fakty_w_krokach']} | {r['kroki']} | {r['rozdzialy']} | {', '.join(r['zmyslenia']) or '—'} | {r['czas_s']} s | {', '.join(r['brak'])} |")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "streszczenie-${{ matrix.tryb.etykieta }}", path: wyniki/}
