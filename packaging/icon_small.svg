      <stop offset="0" stop-color="#40208F"/>
      <stop offset="1" stop-color="#170D3A"/>
    </linearGradient>
    <linearGradient id="am" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD45E"/>
      <stop offset="1" stop-color="#FF9A1F"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <path d="M30 64 Q30 42 50 54 L130 108 Q146 128 130 148 L50 202 Q30 214 30 192 Z" fill="url(#am)"/>
